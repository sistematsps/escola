<!DOCTYPE html>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================
   BODY
========================= */

body {

    font-family:

        Helvetica,

/* =========================
   HEADER
========================= */

    background: #0f172a;

    padding: 15px 25px;

    display: flex;

    gap: 15px;

}


.header-title {

    display: flex;

    align-items: center;

    gap: 10px;

}


.header-title span {

    font-size: 30px;

}


.header-title h1 {

    font-size: 20px;

}


/* =========================
   BOTÕES
========================= */

.btn {

    border: none;

    padding: 11px 16px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    font-size: 14px;

}


.btn-primary {

    background: #2563eb;

    color: white;

}


.btn-primary:hover {

    background: #1d4ed8;

}


.btn-secondary {

    background: #64748b;

    color: white;

}


.btn-success {

    background: #16a34a;

    color: white;

}


.btn-danger {

    background: #dc2626;

    color: white;

}


.btn-warning {

    background: #d97706;

    color: white;

}


.btn-info {

    background: #0891b2;

}


/* =========================
   MAIN
========================= */

    max-width: 1500px;

    margin: auto;

    padding: 25px;

}


/* =========================
   MENSAGEM
========================= */

    display: none;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 20px;

    font-weight: bold;

}


.message.success {

    display: block;

}

   ESCOLA ATUAL

/* =========================
   TOPO
========================= */

.top-area h2 {

/* =========================
   PESQUISA
========================= */

   FORMULÁRIO
========================= */

}

    grid-template-columns:

    gap: 15px;

.form-group label {

    display: block;

    margin-bottom: 6px;

    font-weight: bold;

    font-size: 14px;

}


.form-group input,

    width: 100%;

    padding: 12px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    outline: none;

    font-size: 14px;

}


.form-group input:focus,
.form-group select:focus {

    border-color: #2563eb;

}


.full {

    grid-column: 1 / -1;

}


.form-buttons {

    margin-top: 20px;

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

}


/* =========================
   TABELA
========================= */

.table-box {

    background: white;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);

.table-container {

table {

th {

========================= */

/* =========================

    }

/* =========================
   ESCOLA DO USUÁRIO
========================= */

async function carregarEscolaAtual() {

    if (!dadosUsuario) {

        return;

    }


    /* =========================
       MASTER
    ========================= */

    if (
        dadosUsuario.perfil ===
        "master"
    ) {

        escolaAtualId = null;

        schoolInfo.textContent =
            "Administrador Master — acesso às escolas cadastradas.";

        schoolInfo.className =
            "master-info";

        return;

    }



    /* =========================
       USUÁRIO NORMAL
    ========================= */

    escolaAtualId =
        dadosUsuario.escolaId;


    if (!escolaAtualId) {

        schoolInfo.textContent =
            "Este usuário ainda não está vinculado a uma escola.";

        return;

    }


    const escolaRef =
        doc(
            db,
            "escolas",
            escolaAtualId
        );


    const escolaSnap =
        await getDoc(
            escolaRef
        );


    if (
        !escolaSnap.exists()
    ) {

        schoolInfo.textContent =
            "A escola vinculada não foi encontrada.";

        escolaAtualId = null;

        return;

    }


    const escola =
        escolaSnap.data();


    schoolInfo.textContent =
        escola.nome ||
        "Escola sem nome";

}



/* =========================
   CARREGAR ALUNOS
========================= */

async function carregarAlunos() {

    try {

        alunos = [];


        if (!usuarioAtual) {

            return;

        }


        /* =========================
           MASTER
        ========================= */

        if (
            dadosUsuario.perfil ===
            "master"
        ) {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "alunos"
                    )
                );


            snapshot.forEach(
                item => {

                    alunos.push({

                        id: item.id,

                        ...item.data()

                    });

                }
            );

        }


        /* =========================
           USUÁRIO DA ESCOLA
        ========================= */

        else {

            if (!escolaAtualId) {

                renderizar();

                return;

            }


            const consulta =
                query(

                    collection(
                        db,
                        "alunos"
                    ),

                    where(
                        "escolaId",
                        "==",
                        escolaAtualId
                    )

                );


            const snapshot =
                await getDocs(
                    consulta
                );


            snapshot.forEach(
                item => {

                    alunos.push({

                        id: item.id,

                        ...item.data()

                    });

                }
            );

        }


        renderizar();


    } catch (error) {

        console.error(
            "Erro ao carregar alunos:",
            error
        );


        mostrarMensagem(

            "Erro ao carregar dados: " +
            error.message,

            "error"

        );

    }

}



/* =========================
   RENDERIZAR
========================= */

function renderizar() {

    const termo =
        pesquisa.value
            .toLowerCase()
            .trim();


    const filtrados =
        alunos.filter(
            aluno => {

                const texto =

                    (aluno.nome || "") +
                    " " +
                    (aluno.cpf || "") +
                    " " +
                    (aluno.matricula || "") +
                    " " +
                    (aluno.cidade || "") +
                    " " +
                    (aluno.responsavel || "");


                return texto
                    .toLowerCase()
                    .includes(termo);

            }
        );


    lista.innerHTML = "";


    contador.textContent =

        filtrados.length +
        (
            filtrados.length === 1
                ? " aluno encontrado"
                : " alunos encontrados"
        );


    if (
        !filtrados.length
    ) {

        lista.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >
                    Nenhum aluno encontrado.
                </td>

            </tr>

        `;

        return;

    }



    filtrados.forEach(
        aluno => {

            const tr =
                document.createElement(
                    "tr"
                );


            const ativo =
                aluno.ativo !== false;


            tr.innerHTML = `

                <td>
                    ${escapar(
                        aluno.matricula || "-"
                    )}
                </td>


                <td>

                    <strong>
                        ${escapar(
                            aluno.nome || ""
                        )}
                    </strong>

                </td>


                <td>
                    ${formatarData(
                        aluno.dataNascimento
                    )}
                </td>


                <td>
                    ${escapar(
                        aluno.cpf || "-"
                    )}
                </td>


                <td>
                    ${escapar(
                        aluno.responsavel || "-"
                    )}
                </td>


                <td>
                    ${escapar(
                        aluno.cidade || "-"
                    )}
                </td>


                <td>

                    <span class="
                        status
                        ${
                            ativo
                                ? "active"
                                : "inactive"
                        }
                    ">

                        ${
                            ativo
                                ? "Ativo"
                                : "Inativo"
                        }

                    </span>

                </td>


                <td>

                    <div class="actions">


                        <button
                            class="btn btn-primary"
                            data-action="editar"
                            data-id="${aluno.id}"
                        >
                            Editar
                        </button>


                        <button
                            class="btn btn-warning"
                            data-action="status"
                            data-id="${aluno.id}"
                        >

                            ${
                                ativo
                                    ? "Desativar"
                                    : "Ativar"
                            }

                        </button>


                        <button
                            class="btn btn-danger"
                            data-action="excluir"
                            data-id="${aluno.id}"
                        >
                            Excluir
                        </button>


                    </div>

                </td>

            `;


            lista.appendChild(
                tr
            );

        }
    );

}



/* =========================
   FORMATAR DATA
========================= */

function formatarData(
    data
) {

    if (!data) {

        return "-";

    }


    const partes =
        String(data).split("-");


    if (
        partes.length !== 3
    ) {

        return data;

    }


    return (

        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]

    );

}



/* =========================
   ESCAPAR HTML
========================= */

function escapar(
    valor
) {

    return String(valor)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =========================
   SALVAR ALUNO
========================= */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        if (!usuarioAtual) {

            mostrarMensagem(
                "Usuário não autenticado.",
                "error"
            );

            return;

        }


        const dados =
            pegarDados();


        if (!dados.nome) {

            mostrarMensagem(
                "Digite o nome do aluno.",
                "error"
            );

            return;

        }


        if (
            !dados.dataNascimento
        ) {

            mostrarMensagem(
                "Informe a data de nascimento.",
                "error"
            );

            return;

        }



        /*
         * =================================
         * DEFINIR ESCOLA
         * =================================
         *
         * Usuário normal:
         * usa sua própria escola.
         *
         * Master:
         * precisa escolher uma escola.
         *
         */


        let escolaIdParaSalvar =
            escolaAtualId;



        /* =========================
           MASTER
        ========================= */

        if (
            dadosUsuario.perfil ===
            "master"
        ) {

            /*
             * Para o Master vamos pedir
             * a escola no momento do cadastro.
             */

            const escolaDigitada =
                prompt(
                    "Digite o ID da escola onde este aluno será cadastrado:\n\n" +
                    "Para ver os IDs, utilize o módulo Escolas."
                );


            if (
                !escolaDigitada
            ) {

                mostrarMensagem(
                    "Cadastro cancelado. É necessário informar a escola.",
                    "error"
                );

                return;

            }


            escolaIdParaSalvar =
                escolaDigitada.trim();

        }



        if (
            !escolaIdParaSalvar
        ) {

            mostrarMensagem(
                "Este usuário não está vinculado a uma escola.",
                "error"
            );

            return;

        }



        try {


            /* =========================
               EDITAR
            ========================= */

            if (
                alunoEditando
            ) {


                /*
                 * IMPORTANTE:
                 *
                 * Nunca permitimos alterar
                 * o escolaId durante a edição.
                 */

                await updateDoc(

                    doc(
                        db,
                        "alunos",
                        alunoEditando
                    ),

                    dados

                );


                mostrarMensagem(
                    "Aluno atualizado com sucesso."
                );

            }


            /* =========================
               NOVO
            ========================= */

            else {

                await addDoc(

                    collection(
                        db,
                        "alunos"
                    ),

                    {

                        ...dados,

                        escolaId:
                            escolaIdParaSalvar,

                        criadoPor:
                            usuarioAtual.uid,

                        criadoEm:
                            serverTimestamp()

                    }

                );


                mostrarMensagem(
                    "Aluno cadastrado com sucesso."
                );

            }


            limparFormulario();


            formBox.style.display =
                "none";


            await carregarAlunos();


        } catch (error) {

            console.error(
                "Erro ao salvar aluno:",
                error
            );


            mostrarMensagem(

                "Erro ao salvar aluno: " +
                error.message,

                "error"

            );

        }

    }
);



/* =========================
   NOVO ALUNO
========================= */

document
    .getElementById(
        "btnNovo"
    )
    .addEventListener(
        "click",
        () => {

            limparFormulario();


            /*
             * Usuário normal já possui
             * a escola automaticamente.
             */

            if (
                dadosUsuario &&
                dadosUsuario.perfil !==
                "master" &&
                !escolaAtualId
            ) {

                mostrarMensagem(
                    "Você precisa estar vinculado a uma escola para cadastrar alunos.",
                    "error"
                );

                return;

            }


            formBox.style.display =
                "block";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }
    );



/* =========================
   CANCELAR
========================= */

document
    .getElementById(
        "btnCancelar"
    )
    .addEventListener(
        "click",
        () => {

            limparFormulario();

            formBox.style.display =
                "none";

        }
    );



/* =========================
   PESQUISA
========================= */

pesquisa.addEventListener(
    "input",
    renderizar
);



/* =========================
   AÇÕES
========================= */

lista.addEventListener(
    "click",
    async event => {


        const botao =
            event.target.closest(
                "button"
            );


        if (!botao) {

            return;

        }


        const id =
            botao.dataset.id;


        const action =
            botao.dataset.action;


        const aluno =
            alunos.find(
                item =>
                    item.id === id
            );


        if (!aluno) {

            return;

        }



        /* =========================
           EDITAR
        ========================= */

        if (
            action === "editar"
        ) {

            /*
             * Segurança adicional:
             * usuário normal só pode editar
             * aluno da própria escola.
             */

            if (
                dadosUsuario.perfil !==
                "master" &&
                aluno.escolaId !==
                escolaAtualId
            ) {

                mostrarMensagem(
                    "Você não pode editar este aluno.",
                    "error"
                );

                return;

            }


            alunoEditando =
                id;


            preencherFormulario(
                aluno
            );


            document
                .getElementById(
                    "formTitle"
                )
                .textContent =
                "Editar Aluno";


            formBox.style.display =
                "block";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }



        /* =========================
           STATUS
        ========================= */

        if (
            action === "status"
        ) {

            if (
                dadosUsuario.perfil !==
                "master" &&
                aluno.escolaId !==
                escolaAtualId
            ) {

                mostrarMensagem(
                    "Você não pode alterar este aluno.",
                    "error"
                );

                return;

            }


            const novoStatus =
                aluno.ativo === false;


            const confirmacao =
                confirm(

                    novoStatus

                        ? "Deseja ativar este aluno?"

                        : "Deseja desativar este aluno?"

                );


            if (!confirmacao) {

                return;

            }


            try {

                await updateDoc(

                    doc(
                        db,
                        "alunos",
                        id
                    ),

                    {

                        ativo:
                            novoStatus

                    }

                );


                mostrarMensagem(

                    novoStatus

                        ? "Aluno ativado."

                        : "Aluno desativado."

                );


                await carregarAlunos();


            } catch (error) {

                console.error(error);


                mostrarMensagem(
                    "Erro ao alterar status.",
                    "error"
                );

            }

        }



        /* =========================
           EXCLUIR
        ========================= */

        if (
            action === "excluir"
        ) {


            if (
                dadosUsuario.perfil !==
                "master" &&
                aluno.escolaId !==
                escolaAtualId
            ) {

                mostrarMensagem(
                    "Você não pode excluir este aluno.",
                    "error"
                );

                return;

            }


            const confirmacao =
                confirm(

                    "ATENÇÃO!\n\n" +

                    "A exclusão do aluno é permanente.\n\n" +

                    "O histórico escolar e outros documentos relacionados poderão ser afetados.\n\n" +

                    "Deseja realmente excluir este aluno?"

                );


            if (!confirmacao) {

                return;

            }


            try {

                await deleteDoc(

                    doc(
                        db,
                        "alunos",
                        id
                    )

                );


                mostrarMensagem(
                    "Aluno excluído com sucesso."
                );


                await carregarAlunos();


            } catch (error) {

                console.error(error);


                mostrarMensagem(
                    "Erro ao excluir aluno.",
                    "error"
                );

            }

        }

    }
);



/* =========================
   AUTENTICAÇÃO
========================= */

onAuthStateChanged(
    auth,
    async user => {


        if (!user) {

            alert(
                "Você precisa estar logado para acessar este módulo."
            );


            window.location.href =
                "index.html";


            return;

        }


        usuarioAtual =
            user;


        try {


            /* =========================
               BUSCAR USUÁRIO
            ========================= */

            const usuarioRef =
                doc(
                    db,
                    "usuarios",
                    user.uid
                );


            const usuarioSnap =
                await getDoc(
                    usuarioRef
                );


            if (
                !usuarioSnap.exists()
            ) {

                alert(
                    "Usuário não encontrado no sistema."
                );


                window.location.href =
                    "index.html";


                return;

            }


            dadosUsuario =
                usuarioSnap.data();



            /* =========================
               VERIFICAR ATIVO
            ========================= */

            if (
                dadosUsuario.ativo ===
                false
            ) {

                alert(
                    "Seu usuário está desativado."
                );


                window.location.href =
                    "index.html";


                return;

            }



            /* =========================
               CARREGAR ESCOLA
            ========================= */

            await carregarEscolaAtual();



            /* =========================
               CARREGAR ALUNOS
            ========================= */

            await carregarAlunos();


        } catch (error) {

            console.error(
                "Erro na inicialização:",
                error
            );


            mostrarMensagem(

                "Erro ao carregar dados: " +
                error.message,

                "error"

            );

        }

    }
);



/* =========================
   PAINEL
========================= */

window.voltarPainel =
    function() {

        window.location.href =
            "index.html";

    };


</script>
