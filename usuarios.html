<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuários - Sistema Escolar</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

header{
    background:#0f172a;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-title span{
    font-size:30px;
}

.header-title h1{
    font-size:20px;
}

.btn{
    border:none;
    padding:11px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-secondary{
    background:#64748b;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-warning{
    background:#d97706;
    color:white;
}

main{
    max-width:1400px;
    margin:auto;
    padding:25px;
}

.top-area{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.top-area h2{
    font-size:25px;
}

.search{
    margin-bottom:20px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

.search input:focus{
    border-color:#2563eb;
}

.form-box{
    display:none;
    background:white;
    padding:25px;
    border-radius:14px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.form-box h3{
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#2563eb;
}

.full{
    grid-column:1/-1;
}

.form-buttons{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.table-box{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.table-container{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#e2e8f0;
    padding:13px;
    text-align:left;
    font-size:13px;
}

td{
    padding:12px;
    border-top:1px solid #e2e8f0;
    font-size:14px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status.active{
    background:#dcfce7;
    color:#166534;
}

.status.inactive{
    background:#fee2e2;
    color:#991b1b;
}

.profile{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    background:#dbeafe;
    color:#1e40af;
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.actions .btn{
    padding:7px 9px;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:35px;
    color:#64748b;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.info-box{
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    color:#1e40af;
}

@media(max-width:700px){

    header{
        flex-direction:column;
        align-items:flex-start;
    }

    main{
        padding:15px;
    }

    .top-area{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-title">

        <span>👥</span>

        <h1>
            Usuários do Sistema
        </h1>

    </div>

    <button
        class="btn btn-secondary"
        onclick="voltarPainel()"
    >
        ← Painel
    </button>

</header>


<main>

<div id="message" class="message"></div>


<div class="top-area">

    <h2>
        Usuários cadastrados
    </h2>

    <button
        id="btnNovo"
        class="btn btn-primary"
    >
        + Novo Usuário
    </button>

</div>


<div class="info-box">

    <strong>Controle de acesso:</strong>

    Cada usuário deverá estar vinculado a uma escola.
    O perfil Master possui acesso administrativo geral.

</div>


<div class="search">

    <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar por nome, e-mail ou escola..."
    >

</div>


<section
    id="formBox"
    class="form-box"
>

    <h3 id="formTitle">
        Novo Usuário
    </h3>


    <form id="usuarioForm">

        <div class="form-grid">


            <div class="form-group">

                <label>
                    Nome *
                </label>

                <input
                    type="text"
                    id="nome"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    E-mail *
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Perfil *
                </label>

                <select id="perfil" required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="master">
                        Master
                    </option>

                    <option value="administrador">
                        Administrador
                    </option>

                    <option value="secretaria">
                        Secretaria
                    </option>

                    <option value="usuario">
                        Usuário
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Escola *
                </label>

                <select
                    id="escolaId"
                    required
                >

                    <option value="">
                        Selecione a escola
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="ativo">

                    <option value="true">
                        Ativo
                    </option>

                    <option value="false">
                        Inativo
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    UID do Firebase
                </label>

                <input
                    type="text"
                    id="uid"
                    placeholder="Será preenchido pelo Firebase"
                    readonly
                >

            </div>

        </div>


        <div class="form-buttons">

            <button
                type="submit"
                class="btn btn-success"
            >
                💾 Salvar Usuário
            </button>

            <button
                type="button"
                id="btnCancelar"
                class="btn btn-secondary"
            >
                Cancelar
            </button>

        </div>

    </form>

</section>


<section class="table-box">

<div class="table-container">

<table>

<thead>

<tr>

    <th>Nome</th>

    <th>E-mail</th>

    <th>Perfil</th>

    <th>Escola</th>

    <th>Status</th>

    <th>Ações</th>

</tr>

</thead>


<tbody id="listaUsuarios">

</tbody>

</table>

</div>

</section>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAdwrOqN4-VQsiBByk4FVG-cDvfrR8ZYac",

    authDomain:
        "dasorte-66ec5.firebaseapp.com",

    projectId:
        "dasorte-66ec5",

    storageBucket:
        "dasorte-66ec5.firebasestorage.app",

    messagingSenderId:
        "606389335961",

    appId:
        "1:606389335961:web:feac4e89f8b4fa74684508"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   ELEMENTOS
========================= */

const form =
    document.getElementById("usuarioForm");

const formBox =
    document.getElementById("formBox");

const lista =
    document.getElementById("listaUsuarios");

const pesquisa =
    document.getElementById("pesquisa");

const message =
    document.getElementById("message");

const escolaSelect =
    document.getElementById("escolaId");


let usuarios = [];

let escolas = [];

let usuarioEditando = null;

let usuarioAtual = null;


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(
    texto,
    tipo="success"
){

    message.textContent =
        texto;

    message.className =
        "message " + tipo;

    setTimeout(()=>{

        message.className =
            "message";

    },4000);

}


/* =========================
   ESCAPAR HTML
========================= */

function escapar(valor){

    return String(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   CARREGAR ESCOLAS
========================= */

async function carregarEscolas(){

    const snapshot =
        await getDocs(
            collection(db,"escolas")
        );

    escolas = [];

    snapshot.forEach(item=>{

        escolas.push({

            id:item.id,

            ...item.data()

        });

    });

}


/* =========================
   ESCOLA PELO ID
========================= */

function nomeEscola(id){

    const escola =
        escolas.find(
            item => item.id === id
        );

    return escola
        ? escola.nome
        : "Sem escola";

}


/* =========================
   PREENCHER ESCOLAS
========================= */

function preencherEscolas(){

    escolaSelect.innerHTML = `
        <option value="">
            Selecione a escola
        </option>
    `;


    escolas.forEach(escola=>{

        const option =
            document.createElement("option");

        option.value =
            escola.id;

        option.textContent =
            escola.nome;

        escolaSelect.appendChild(
            option
        );

    });

}


/* =========================
   CARREGAR USUÁRIOS
========================= */

async function carregarUsuarios(){

    try{

        const snapshot =
            await getDocs(
                collection(db,"usuarios")
            );

        usuarios = [];

        snapshot.forEach(item=>{

            usuarios.push({

                id:item.id,

                ...item.data()

            });

        });


        renderizar();

    }catch(error){

        console.error(error);

        mostrarMensagem(
            "Erro ao carregar usuários.",
            "error"
        );

    }

}


/* =========================
   RENDERIZAR
========================= */

function renderizar(){

    const termo =
        pesquisa.value
            .toLowerCase()
            .trim();


    let filtrados =
        usuarios.filter(usuario=>{

            const texto = (

                (usuario.nome || "") +
                " " +
                (usuario.email || "") +
                " " +
                nomeEscola(
                    usuario.escolaId
                )

            ).toLowerCase();

            return texto.includes(termo);

        });


    /*
     * USUÁRIO NÃO MASTER
     *
     * Visualiza apenas usuários
     * da própria escola.
     */

    if(
        usuarioAtual &&
        usuarioAtual.perfil !== "master"
    ){

        filtrados =
            filtrados.filter(
                usuario =>
                    usuario.escolaId ===
                    usuarioAtual.escolaId
            );

    }


    lista.innerHTML = "";


    if(!filtrados.length){

        lista.innerHTML = `

        <tr>

            <td
                colspan="6"
                class="empty"
            >
                Nenhum usuário encontrado.
            </td>

        </tr>

        `;

        return;

    }


    filtrados.forEach(usuario=>{

        const tr =
            document.createElement("tr");


        const ativo =
            usuario.ativo !== false;


        tr.innerHTML = `

        <td>

            <strong>
                ${escapar(
                    usuario.nome || "-"
                )}
            </strong>

        </td>


        <td>

            ${escapar(
                usuario.email || "-"
            )}

        </td>


        <td>

            <span class="profile">

                ${escapar(
                    usuario.perfil || "usuario"
                )}

            </span>

        </td>


        <td>

            ${escapar(
                nomeEscola(
                    usuario.escolaId
                )
            )}

        </td>


        <td>

            <span class="
                status
                ${ativo
                    ? "active"
                    : "inactive"}
            ">

                ${ativo
                    ? "Ativo"
                    : "Inativo"}

            </span>

        </td>


        <td>

            <div class="actions">

                <button
                    class="btn btn-primary"
                    data-action="editar"
                    data-id="${usuario.id}"
                >
                    Editar
                </button>


                <button
                    class="btn btn-warning"
                    data-action="status"
                    data-id="${usuario.id}"
                >

                    ${ativo
                        ? "Desativar"
                        : "Ativar"}

                </button>


                <button
                    class="btn btn-danger"
                    data-action="excluir"
                    data-id="${usuario.id}"
                >
                    Excluir
                </button>

            </div>

        </td>

        `;


        lista.appendChild(tr);

    });

}


/* =========================
   LIMPAR
========================= */

function limparFormulario(){

    form.reset();

    document
        .getElementById("uid")
        .value = "";

    usuarioEditando = null;

    document
        .getElementById("formTitle")
        .textContent =
        "Novo Usuário";

}


/* =========================
   PREENCHER FORM
========================= */

function preencherFormulario(usuario){

    document
        .getElementById("nome")
        .value =
        usuario.nome || "";


    document
        .getElementById("email")
        .value =
        usuario.email || "";


    document
        .getElementById("perfil")
        .value =
        usuario.perfil || "usuario";


    document
        .getElementById("escolaId")
        .value =
        usuario.escolaId || "";


    document
        .getElementById("ativo")
        .value =
        usuario.ativo === false
        ? "false"
        : "true";


    document
        .getElementById("uid")
        .value =
        usuario.uid || usuario.id;

}


/* =========================
   SALVAR
========================= */

form.addEventListener(
    "submit",
    async event=>{

        event.preventDefault();


        /*
         * Nesta primeira versão,
         * somente usuários existentes
         * podem ser editados.
         */

        if(!usuarioEditando){

            mostrarMensagem(
                "A criação da conta de login será disponibilizada na próxima etapa. Por enquanto, edite usuários já existentes.",
                "error"
            );

            return;

        }


        const dados = {

            nome:
                document
                    .getElementById("nome")
                    .value
                    .trim(),

            email:
                document
                    .getElementById("email")
                    .value
                    .trim(),

            perfil:
                document
                    .getElementById("perfil")
                    .value,

            escolaId:
                document
                    .getElementById("escolaId")
                    .value,

            ativo:
                document
                    .getElementById("ativo")
                    .value === "true"

        };


        if(!dados.nome){

            mostrarMensagem(
                "Digite o nome.",
                "error"
            );

            return;

        }


        if(
            dados.perfil !== "master" &&
            !dados.escolaId
        ){

            mostrarMensagem(
                "Selecione a escola do usuário.",
                "error"
            );

            return;

        }


        try{

            await updateDoc(

                doc(
                    db,
                    "usuarios",
                    usuarioEditando
                ),

                dados

            );


            mostrarMensagem(
                "Usuário atualizado com sucesso."
            );


            limparFormulario();

            formBox.style.display =
                "none";

            await carregarUsuarios();

        }catch(error){

            console.error(error);

            mostrarMensagem(
                "Erro ao atualizar usuário.",
                "error"
            );

        }

    }
);


/* =========================
   NOVO
========================= */

document
    .getElementById("btnNovo")
    .addEventListener(
        "click",
        ()=>{

            limparFormulario();

            formBox.style.display =
                "block";

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );


/* =========================
   CANCELAR
========================= */

document
    .getElementById("btnCancelar")
    .addEventListener(
        "click",
        ()=>{

            limparFormulario();

            formBox.style.display =
                "none";

        }
    );


/* =========================
   PESQUISA
========================= */

pesquisa.addEventListener(
    "input",
    renderizar
);


/* =========================
   AÇÕES
========================= */

lista.addEventListener(
    "click",
    async event=>{

        const botao =
            event.target.closest("button");

        if(!botao) return;


        const id =
            botao.dataset.id;

        const action =
            botao.dataset.action;


        const usuario =
            usuarios.find(
                item => item.id === id
            );


        if(!usuario)
            return;


        /*
         * NÃO PERMITIR QUE USUÁRIO
         * COMUM EDITE OUTRA ESCOLA.
         */

        if(
            usuarioAtual &&
            usuarioAtual.perfil !== "master" &&
            usuario.escolaId !==
            usuarioAtual.escolaId
        ){

            mostrarMensagem(
                "Você não tem permissão para este usuário.",
                "error"
            );

            return;

        }


        /* EDITAR */

        if(action === "editar"){

            usuarioEditando =
                id;

            preencherFormulario(
                usuario
            );

            document
                .getElementById("formTitle")
                .textContent =
                "Editar Usuário";

            formBox.style.display =
                "block";

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }


        /* STATUS */

        if(action === "status"){

            const novoStatus =
                usuario.ativo === false;


            if(
                usuario.id ===
                usuarioAtual?.uid
            ){

                mostrarMensagem(
                    "Você não pode desativar o próprio usuário.",
                    "error"
                );

                return;

            }


            if(!confirm(
                novoStatus
                ? "Deseja ativar este usuário?"
                : "Deseja desativar este usuário?"
            )){

                return;

            }


            try{

                await updateDoc(

                    doc(
                        db,
                        "usuarios",
                        id
                    ),

                    {
                        ativo:
                            novoStatus
                    }

                );


                mostrarMensagem(
                    novoStatus
                    ? "Usuário ativado."
                    : "Usuário desativado."
                );


                await carregarUsuarios();

            }catch(error){

                console.error(error);

                mostrarMensagem(
                    "Erro ao alterar status.",
                    "error"
                );

            }

        }


        /* EXCLUIR */

        if(action === "excluir"){

            if(
                usuario.id ===
                usuarioAtual?.uid
            ){

                mostrarMensagem(
                    "Você não pode excluir seu próprio usuário.",
                    "error"
                );

                return;

            }


            if(!confirm(
                "ATENÇÃO!\n\n"+
                "Esta operação excluirá o cadastro do usuário no Firestore.\n\n"+
                "Deseja continuar?"
            )){

                return;

            }


            try{

                await deleteDoc(

                    doc(
                        db,
                        "usuarios",
                        id
                    )

                );


                mostrarMensagem(
                    "Cadastro do usuário excluído."
                );


                await carregarUsuarios();

            }catch(error){

                console.error(error);

                mostrarMensagem(
                    "Erro ao excluir usuário.",
                    "error"
                );

            }

        }

    }
);


/* =========================
   AUTENTICAÇÃO
========================= */

onAuthStateChanged(
    auth,
    async user=>{

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        try{

            const snap =
                await getDocs(
                    collection(
                        db,
                        "usuarios"
                    )
                );


            let encontrado = null;


            snap.forEach(item=>{

                const data =
                    item.data();

                if(
                    data.uid === user.uid ||
                    item.id === user.uid
                ){

                    encontrado = {

                        id:item.id,

                        ...data

                    };

                }

            });


            if(!encontrado){

                alert(
                    "Usuário não encontrado no cadastro."
                );

                window.location.href =
                    "index.html";

                return;

            }


            usuarioAtual =
                encontrado;


            /*
             * Somente Master pode
             * administrar usuários.
             */

            if(
                usuarioAtual.perfil !==
                "master"
            ){

                document
                    .getElementById("btnNovo")
                    .style.display =
                    "none";

                document
                    .getElementById("formBox")
                    .style.display =
                    "none";

            }


            await carregarEscolas();

            preencherEscolas();

            await carregarUsuarios();

        }catch(error){

            console.error(error);

            mostrarMensagem(
                "Erro ao carregar dados: "+
                error.message,
                "error"
            );

        }

    }
);


/* =========================
   PAINEL
========================= */

window.voltarPainel =
function(){

    window.location.href =
        "index.html";

};
