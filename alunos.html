<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Cadastro de Alunos</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

header{
    background:#0f172a;
    color:white;
    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-title span{
    font-size:30px;
}

.header-title h1{
    font-size:20px;
}

.btn{
    border:none;
    padding:11px 16px;
    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-secondary{
    background:#64748b;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-warning{
    background:#d97706;
    color:white;
}

main{
    max-width:1500px;
    margin:auto;
    padding:25px;
}

.top-area{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:20px;
}

.top-area h2{
    font-size:25px;
}

.info{
    background:#dbeafe;
    color:#1e40af;

    padding:14px;

    border-radius:10px;

    margin-bottom:20px;

    font-weight:bold;
}

.message{
    display:none;

    padding:12px;

    border-radius:8px;

    margin-bottom:20px;
}

.message.success{
    display:block;

    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;

    background:#fee2e2;
    color:#991b1b;
}

.form-box{
    display:none;

    background:white;

    padding:25px;

    border-radius:14px;

    margin-bottom:25px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.form-box h3{
    margin-bottom:20px;
}

.section-title{
    font-size:18px;
    font-weight:bold;

    margin-top:25px;
    margin-bottom:15px;

    padding-bottom:8px;

    border-bottom:
        2px solid #e2e8f0;
}

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
}

.form-group label{
    display:block;

    margin-bottom:6px;

    font-weight:bold;

    font-size:14px;
}

.form-group input,
.form-group select,
.form-group textarea{

    width:100%;

    padding:12px;

    border:
        1px solid #cbd5e1;

    border-radius:8px;

    outline:none;

    font-size:14px;
}

.form-group textarea{
    min-height:100px;

    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{

    border-color:#2563eb;

}

.full{
    grid-column:1/-1;
}

.form-buttons{
    margin-top:25px;

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.search{
    margin-bottom:20px;
}

.search input{

    width:100%;

    padding:13px;

    border:
        1px solid #cbd5e1;

    border-radius:9px;

    font-size:15px;

    outline:none;
}

.table-box{

    background:white;

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.table-container{

    width:100%;

    overflow-x:auto;
}

table{

    width:100%;

    border-collapse:collapse;

    min-width:1100px;
}

th{

    background:#e2e8f0;

    padding:13px;

    text-align:left;

    font-size:13px;
}

td{

    padding:12px;

    border-top:
        1px solid #e2e8f0;

    font-size:14px;
}

.status{

    display:inline-block;

    padding:5px 9px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;
}

.status.active{

    background:#dcfce7;

    color:#166534;
}

.status.inactive{

    background:#fee2e2;

    color:#991b1b;
}

.actions{

    display:flex;

    gap:6px;

    flex-wrap:wrap;
}

.actions .btn{

    padding:7px 9px;

    font-size:12px;
}

.empty{

    text-align:center;

    padding:35px;

    color:#64748b;
}

.loading{

    text-align:center;

    padding:30px;

    color:#64748b;
}

@media(max-width:900px){

    .form-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:650px){

    header{

        flex-direction:column;

        align-items:flex-start;

    }

    main{

        padding:15px;

    }

    .top-area{

        flex-direction:column;

        align-items:flex-start;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .full{

        grid-column:auto;

    }

}

</style>

</head>

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */


import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

getAuth,
onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

getFirestore,
collection,
addDoc,
getDocs,
doc,
getDoc,
updateDoc,
deleteDoc,
serverTimestamp

}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyAdwrOqN4-VQsiBByk4FVG-cDvfrR8ZYac",

authDomain:
"dasorte-66ec5.firebaseapp.com",

projectId:
"dasorte-66ec5",

storageBucket:
"dasorte-66ec5.firebasestorage.app",

messagingSenderId:
"606389335961",

appId:
"1:606389335961:web:feac4e89f8b4fa74684508"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =====================================================
   VARIÁVEIS
===================================================== */


let usuarioAtual = null;

let perfilUsuario = "master";

let escolaUsuario = null;

let escolas = [];

let alunos = [];

let alunoEditando = null;


/* =====================================================
   ELEMENTOS
===================================================== */


const info =
document.getElementById("info");

const message =
document.getElementById("message");

const escolaSelect =
document.getElementById("escolaId");

const formBox =
document.getElementById("formBox");

const form =
document.getElementById("alunoForm");

const lista =
document.getElementById("listaAlunos");

const pesquisa =
document.getElementById("pesquisa");


/* =====================================================
   MENSAGEM
===================================================== */


function mostrarMensagem(
texto,
tipo="success"
){

message.textContent =
texto;

message.className =
"message " + tipo;

setTimeout(
()=>{

message.className =
"message";

},
5000
);

}


/* =====================================================
   ESCAPAR
===================================================== */


function escapar(valor){

return String(valor ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */


onAuthStateChanged(
auth,
async user => {

console.log(
"Usuário Firebase:",
user
);


if(!user){

info.textContent =
"⛔ Nenhum usuário autenticado.";

mostrarMensagem(
"Você precisa estar logado.",
"error"
);

return;

}


usuarioAtual =
user;


info.textContent =
"Usuário autenticado: " +
(
user.email ||
user.uid
);


/*
 * Neste primeiro momento,
 * o usuário autenticado será tratado
 * como Master.
 *
 * Depois vamos conectar isso ao
 * documento de usuários.
 */


try{

await carregarEscolas();

await carregarAlunos();

}catch(error){

console.error(error);

mostrarMensagem(
"Erro ao carregar dados: " +
error.message,
"error"
);

}

});


/* =====================================================
   ESCOLAS
===================================================== */


async function carregarEscolas(){

const snapshot =
await getDocs(
collection(
db,
"escolas"
)
);


escolas = [];


snapshot.forEach(
item => {

escolas.push({

id:item.id,

...item.data()

});

});


escolas.sort(
(a,b)=>
(a.nome || "")
.localeCompare(
b.nome || "",
"pt-BR"
)
);


preencherEscolas();

}


/* =====================================================
   SELECT ESCOLAS
===================================================== */


function preencherEscolas(){

escolaSelect.innerHTML =
`
<option value="">
Selecione a escola
</option>
`;


escolas.forEach(
escola => {

if(escola.ativa === false)
return;


const option =
document.createElement(
"option"
);


option.value =
escola.id;


option.textContent =
escola.nome;


escolaSelect.appendChild(
option
);

});

}


/* =====================================================
   CARREGAR ALUNOS
===================================================== */


async function carregarAlunos(){

const snapshot =
await getDocs(
collection(
db,
"alunos"
)
);


alunos = [];


snapshot.forEach(
item => {

alunos.push({

id:item.id,

...item.data()

});

});


renderizarAlunos();

}


/* =====================================================
   RENDERIZAR
===================================================== */


function renderizarAlunos(){

const termo =
pesquisa.value
.toLowerCase()
.trim();


const filtrados =
alunos.filter(
aluno => {

const texto =

(aluno.nome || "") +
" " +
(aluno.matricula || "");


return texto
.toLowerCase()
.includes(termo);

});


lista.innerHTML = "";


if(!filtrados.length){

lista.innerHTML = `

<tr>

<td
colspan="8"
class="empty"
>

Nenhum aluno encontrado.

</td>

</tr>

`;

return;

}


filtrados.forEach(
aluno => {

const escola =
escolas.find(
e =>
e.id ===
aluno.escolaId
);


const tr =
document.createElement(
"tr"
);


tr.innerHTML = `

<td>

${escapar(
aluno.matricula
)}

</td>


<td>

<strong>

${escapar(
aluno.nome
)}

</strong>

</td>


<td>

${escapar(
escola?.nome || "-"
)}

</td>


<td>

${escapar(
aluno.dataNascimento || "-"
)}

</td>


<td>

${escapar(
aluno.anoLetivo || "-"
)}

</td>


<td>

${escapar(
aluno.turma || "-"
)}

</td>


<td>

<span class="
status
${
aluno.situacao === "Inativo"
? "inactive"
: "active"
}
">

${escapar(
aluno.situacao || "Ativo"
)}

</span>

</td>


<td>

<div class="actions">

<button
class="btn btn-primary"
data-action="editar"
data-id="${aluno.id}"
>
Editar
</button>


<button
class="btn btn-danger"
data-action="excluir"
data-id="${aluno.id}"
>
Excluir
</button>

</div>

</td>

`;


lista.appendChild(
tr
);

});

}


/* =====================================================
   PEGAR FORMULÁRIO
===================================================== */


function pegarDados(){

return {

escolaId:
escolaSelect.value,

matricula:
document.getElementById(
"matricula"
).value.trim(),

nome:
document.getElementById(
"nome"
).value.trim(),

dataNascimento:
document.getElementById(
"dataNascimento"
).value,

sexo:
document.getElementById(
"sexo"
).value,

cpf:
document.getElementById(
"cpf"
).value.trim(),

rg:
document.getElementById(
"rg"
).value.trim(),

naturalidade:
document.getElementById(
"naturalidade"
).value.trim(),

nacionalidade:
document.getElementById(
"nacionalidade"
).value.trim(),

nomeMae:
document.getElementById(
"nomeMae"
).value.trim(),

nomePai:
document.getElementById(
"nomePai"
).value.trim(),

responsavel:
document.getElementById(
"responsavel"
).value.trim(),

telefoneResponsavel:
document.getElementById(
"telefoneResponsavel"
).value.trim(),

endereco:
document.getElementById(
"endereco"
).value.trim(),

numero:
document.getElementById(
"numero"
).value.trim(),

bairro:
document.getElementById(
"bairro"
).value.trim(),

cidade:
document.getElementById(
"cidade"
).value.trim(),

estado:
document.getElementById(
"estado"
).value,

cep:
document.getElementById(
"cep"
).value.trim(),

telefone:
document.getElementById(
"telefone"
).value.trim(),

email:
document.getElementById(
"email"
).value.trim(),

dataMatricula:
document.getElementById(
"dataMatricula"
).value,

anoLetivo:
document.getElementById(
"anoLetivo"
).value,

turma:
document.getElementById(
"turma"
).value.trim(),

situacao:
document.getElementById(
"situacao"
).value,

observacoes:
document.getElementById(
"observacoes"
).value.trim()

};

}


/* =====================================================
   LIMPAR
===================================================== */


function limparFormulario(){

form.reset();

alunoEditando =
null;

document.getElementById(
"nacionalidade"
).value =
"Brasileira";

document.getElementById(
"situacao"
).value =
"Ativo";

document.getElementById(
"formTitle"
).textContent =
"Novo Aluno";

}


/* =====================================================
   NOVO ALUNO
===================================================== */


document
.getElementById("btnNovo")
.addEventListener(
"click",
()=>{

limparFormulario();

formBox.style.display =
"block";

window.scrollTo({

top:0,

behavior:"smooth"

});

});


/* =====================================================
   CANCELAR
===================================================== */


document
.getElementById("btnCancelar")
.addEventListener(
"click",
()=>{

limparFormulario();

formBox.style.display =
"none";

});


/* =====================================================
   SALVAR ALUNO
===================================================== */


form.addEventListener(
"submit",
async event => {

event.preventDefault();


const dados =
pegarDados();


if(!dados.escolaId){

mostrarMensagem(
"Selecione a escola.",
"error"
);

return;

}


if(!dados.matricula){

mostrarMensagem(
"Digite a matrícula.",
"error"
);

return;

}


if(!dados.nome){

mostrarMensagem(
"Digite o nome do aluno.",
"error"
);

return;

}


try{


/*
 * VERIFICA DUPLICIDADE
 */


const matriculaExistente =
alunos.find(
aluno =>

aluno.escolaId ===
dados.escolaId

&&

String(
aluno.matricula
)
.toLowerCase()

===

String(
dados.matricula
)
.toLowerCase()

&&

aluno.id !==
alunoEditando
);


if(matriculaExistente){

mostrarMensagem(
"Esta matrícula já existe nesta escola.",
"error"
);

return;

}


/*
 * SALVAR
 */


if(alunoEditando){

await updateDoc(

doc(
db,
"alunos",
alunoEditando
),

dados

);


mostrarMensagem(
"Aluno atualizado com sucesso."
);

}else{


await addDoc(

collection(
db,
"alunos"
),

{

...dados,

criadoPor:
usuarioAtual.uid,

criadoEm:
serverTimestamp()

}

);


mostrarMensagem(
"Aluno cadastrado com sucesso."
);

}


limparFormulario();

formBox.style.display =
"none";


await carregarAlunos();


}catch(error){

console.error(error);

mostrarMensagem(

"Erro ao salvar aluno: " +
error.message,

"error"

);

}

});


/* =====================================================
   PESQUISA
===================================================== */


pesquisa.addEventListener(
"input",
renderizarAlunos
);
