<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Cadastro de Alunos</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:Arial,Helvetica,sans-serif;

    background:#f1f5f9;

    color:#1e293b;

}

/* =========================
HEADER
========================= */

header{

    background:#0f172a;

    color:white;

    padding:15px 25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

}

.header-title{

    display:flex;

    align-items:center;

    gap:10px;

}

.header-title span{

    font-size:30px;

}

.header-title h1{

    font-size:20px;

}

/* =========================
BOTÕES
========================= */

.btn{

    border:none;

    padding:11px 16px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

    font-size:14px;

}

.btn-primary{

    background:#2563eb;

    color:white;

}

.btn-primary:hover{

    background:#1d4ed8;

}

.btn-secondary{

    background:#64748b;

    color:white;

}

.btn-success{

    background:#16a34a;

    color:white;

}

.btn-danger{

    background:#dc2626;

    color:white;

}

.btn-warning{

    background:#d97706;

    color:white;

}

/* =========================
MAIN
========================= */

main{

    max-width:1400px;

    margin:auto;

    padding:25px;

}

/* =========================
TOPO
========================= */

.top-area{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:20px;

}

.top-area h2{

    font-size:25px;

}

/* =========================
ESCOLA
========================= */

.school-info{

    background:white;

    padding:15px 20px;

    border-radius:12px;

    margin-bottom:20px;

    border-left:5px solid #2563eb;

    box-shadow:0 5px 20px rgba(0,0,0,.05);

}

.school-info strong{

    display:block;

    margin-bottom:5px;

}

.school-info span{

    color:#64748b;

}

/* =========================
PESQUISA
========================= */

.search{

    margin-bottom:20px;

}

.search input{

    width:100%;

    padding:13px;

    border:1px solid #cbd5e1;

    border-radius:9px;

    font-size:15px;

    outline:none;

}

.search input:focus{

    border-color:#2563eb;

}

/* =========================
FORMULÁRIO
========================= */

.form-box{

    display:none;

    background:white;

    padding:25px;

    border-radius:14px;

    margin-bottom:25px;

    box-shadow:0 5px 20px rgba(0,0,0,.06);

}

.form-box h3{

    margin-bottom:20px;

}

.form-grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:15px;

}

.form-group label{

    display:block;

    margin-bottom:6px;

    font-weight:bold;

    font-size:14px;

}

.form-group input,

.form-group select{

    width:100%;

    padding:12px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    outline:none;

    font-size:14px;

}

.form-group input:focus,

.form-group select:focus{

    border-color:#2563eb;

}

.full{

    grid-column:1/-1;

}

.form-buttons{

    margin-top:20px;

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}

/* =========================
TABELA
========================= */

.table-box{

    background:white;

    border-radius:14px;

    overflow:hidden;

    box-shadow:0 5px 20px rgba(0,0,0,.06);

}

.table-container{

    width:100%;

    overflow-x:auto;

}

table{

    width:100%;

    border-collapse:collapse;

    min-width:1100px;

}

th{

    background:#e2e8f0;

    padding:13px;

    text-align:left;

    font-size:13px;

}

td{

    padding:12px;

    border-top:1px solid #e2e8f0;

    font-size:14px;

}

.actions{

    display:flex;

    gap:6px;

    flex-wrap:wrap;

}

.actions .btn{

    padding:7px 9px;

    font-size:12px;

}

/* =========================
STATUS
========================= */

.status{

    display:inline-block;

    padding:5px 9px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

}

.status.ativo{

    background:#dcfce7;

    color:#166534;

}

.status.inativo{

    background:#fee2e2;

    color:#991b1b;

}

/* =========================
MENSAGEM
========================= */

.message{

    display:none;

    padding:12px;

    border-radius:8px;

    margin-bottom:20px;

}

.message.success{

    display:block;

    background:#dcfce7;

    color:#166534;

}

.message.error{

    display:block;

    background:#fee2e2;

    color:#991b1b;

}

.empty{

    text-align:center;

    padding:35px;

    color:#64748b;

}

/* =========================
MOBILE
========================= */

@media(max-width:800px){

    header{

        flex-direction:column;

        align-items:flex-start;

    }

    main{

        padding:15px;

    }

    .top-area{

        flex-direction:column;

        align-items:flex-start;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .full{

        grid-column:auto;

    }

}

</style>

</head>

<body>


<!-- =========================
HEADER
========================= -->

<header>

    <div class="header-title">

        <span>👨‍🎓</span>

        <h1>
            Cadastro de Alunos
        </h1>

    </div>

    <button
        class="btn btn-secondary"
        onclick="voltarPainel()"
    >
        ← Painel
    </button>

</header>


<main>


<!-- =========================
MENSAGEM
========================= -->

<div
    id="message"
    class="message"
></div>


<!-- =========================
ESCOLA
========================= -->

<div class="school-info">

    <strong>
        🏫 Escola vinculada
    </strong>

    <span id="schoolName">
        Carregando...
    </span>

</div>


<!-- =========================
TOPO
========================= -->

<div class="top-area">

    <h2>
        Alunos cadastrados
    </h2>

    <button
        id="btnNovo"
        class="btn btn-primary"
    >
        + Novo Aluno
    </button>

</div>


<!-- =========================
PESQUISA
========================= -->

<div class="search">

    <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar por nome, matrícula ou CPF..."
    >

</div>


<!-- =========================
FORMULÁRIO
========================= -->

<section
    id="formBox"
    class="form-box"
>

<h3 id="formTitle">
    Novo Aluno
</h3>


<form id="alunoForm">


<div class="form-grid">


<!-- DADOS PESSOAIS -->

<div class="form-group full">

<label>
Nome completo *
</label>

<input
    type="text"
    id="nome"
    required
>

</div>


<div class="form-group">

<label>
Nome social
</label>

<input
    type="text"
    id="nomeSocial"
>

</div>


<div class="form-group">

<label>
Data de nascimento *
</label>

<input
    type="date"
    id="dataNascimento"
    required
>

</div>


<div class="form-group">

<label>
Sexo
</label>

<select id="sexo">

<option value="">
Selecione
</option>

<option value="Masculino">
Masculino
</option>

<option value="Feminino">
Feminino
</option>

<option value="Outro">
Outro
</option>

</select>

</div>


<div class="form-group">

<label>
CPF
</label>

<input
    type="text"
    id="cpf"
>

</div>


<div class="form-group">

<label>
RG
</label>

<input
    type="text"
    id="rg"
>

</div>


<div class="form-group">

<label>
Nacionalidade
</label>

<input
    type="text"
    id="nacionalidade"
    value="Brasileira"
>

</div>


<div class="form-group">

<label>
Naturalidade
</label>

<input
    type="text"
    id="naturalidade"
>

</div>


<!-- FILIAÇÃO -->

<div class="form-group full">

<label>
Nome da mãe
</label>

<input
    type="text"
    id="mae"
>

</div>


<div class="form-group full">

<label>
Nome do pai
</label>

<input
    type="text"
    id="pai"
>

</div>


<!-- RESPONSÁVEL -->

<div class="form-group">

<label>
Responsável
</label>

<input
    type="text"
    id="responsavel"
>

</div>


<div class="form-group">

<label>
Telefone do responsável
</label>

<input
    type="text"
    id="telefone"
>

</div>


<!-- ENDEREÇO -->

<div class="form-group full">

<label>
Endereço
</label>

<input
    type="text"
    id="endereco"
>

</div>


<div class="form-group">

<label>
Número
</label>

<input
    type="text"
    id="numero"
>

</div>


<div class="form-group">

<label>
Bairro
</label>

<input
    type="text"
    id="bairro"
>

</div>


<div class="form-group">

<label>
Cidade
</label>

<input
    type="text"
    id="cidade"
>

</div>


<div class="form-group">

<label>
Estado
</label>

<select id="estado">

<option value="">
Selecione
</option>

<option value="AC">Acre</option>
<option value="AL">Alagoas</option>
<option value="AP">Amapá</option>
<option value="AM">Amazonas</option>
<option value="BA">Bahia</option>
<option value="CE">Ceará</option>
<option value="DF">Distrito Federal</option>
<option value="ES">Espírito Santo</option>
<option value="GO">Goiás</option>
<option value="MA">Maranhão</option>
<option value="MT">Mato Grosso</option>
<option value="MS">Mato Grosso do Sul</option>
<option value="MG">Minas Gerais</option>
<option value="PA">Pará</option>
<option value="PB">Paraíba</option>
<option value="PR">Paraná</option>
<option value="PE">Pernambuco</option>
<option value="PI">Piauí</option>
<option value="RJ">Rio de Janeiro</option>
<option value="RN">Rio Grande do Norte</option>
<option value="RS">Rio Grande do Sul</option>
<option value="RO">Rondônia</option>
<option value="RR">Roraima</option>
<option value="SC">Santa Catarina</option>
<option value="SP">São Paulo</option>
<option value="SE">Sergipe</option>
<option value="TO">Tocantins</option>

</select>

</div>


<div class="form-group">

<label>
CEP
</label>

<input
    type="text"
    id="cep"
>

</div>


<!-- MATRÍCULA -->

<div class="form-group">

<label>
Matrícula *
</label>

<input
    type="text"
    id="matricula"
    required
>

</div>


<div class="form-group">

<label>
Turma
</label>

<input
    type="text"
    id="turma"
>

</div>


<div class="form-group">

<label>
Turno
</label>

<select id="turno">

<option value="">
Selecione
</option>

<option value="Matutino">
Matutino
</option>

<option value="Vespertino">
Vespertino
</option>

<option value="Noturno">
Noturno
</option>

<option value="Integral">
Integral
</option>

</select>

</div>


<div class="form-group">

<label>
Ano letivo
</label>

<input
    type="number"
    id="anoLetivo"
    min="2000"
    max="2100"
>

</div>


<div class="form-group">

<label>
Situação
</label>

<select id="situacao">

<option value="Ativo">
Ativo
</option>

<option value="Transferido">
Transferido
</option>

<option value="Concluído">
Concluído
</option>

<option value="Inativo">
Inativo
</option>

</select>

</div>


</div>


<div class="form-buttons">

<button
    type="submit"
    class="btn btn-success"
>
💾 Salvar Aluno
</button>

<button
    type="button"
    id="btnCancelar"
    class="btn btn-secondary"
>
Cancelar
</button>

</div>


</form>

</section>


<!-- =========================
TABELA
========================= -->

<section class="table-box">

<div class="table-container">

<table>

<thead>

<tr>

<th>Nome</th>

<th>Matrícula</th>

<th>CPF</th>

<th>Nascimento</th>

<th>Turma</th>

<th>Turno</th>

<th>Situação</th>

<th>Ações</th>

</tr>

</thead>

<tbody id="listaAlunos">

</tbody>

</table>

</div>

</section>


</main>


<script type="module">

/* =========================
FIREBASE
========================= */

import {

initializeApp

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

getAuth,
onAuthStateChanged

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

getFirestore,
collection,
addDoc,
getDocs,
query,
where,
doc,
updateDoc,
deleteDoc,
getDoc,
serverTimestamp

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyAdwrOqN4-VQsiBByk4FVG-cDvfrR8ZYac",

authDomain:
"dasorte-66ec5.firebaseapp.com",

projectId:
"dasorte-66ec5",

storageBucket:
"dasorte-66ec5.firebasestorage.app",

messagingSenderId:
"606389335961",

appId:
"1:606389335961:web:feac4e89f8b4fa74684508"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================
ELEMENTOS
========================= */

const form =
document.getElementById("alunoForm");

const formBox =
document.getElementById("formBox");

const lista =
document.getElementById("listaAlunos");

const pesquisa =
document.getElementById("pesquisa");

const message =
document.getElementById("message");

const schoolName =
document.getElementById("schoolName");


let alunos = [];

let alunoEditando = null;

let usuarioAtual = null;

let escolaAtual = null;


/* =========================
MENSAGEM
========================= */

function mostrarMensagem(
texto,
tipo="success"
){

message.textContent =
texto;

message.className =
"message "+tipo;

setTimeout(()=>{

message.className =
"message";

},4000);

}


/* =========================
PEGAR DADOS
========================= */

function pegarDados(){

return {

nome:
document.getElementById("nome").value.trim(),

nomeSocial:
document.getElementById("nomeSocial").value.trim(),

dataNascimento:
document.getElementById("dataNascimento").value,

sexo:
document.getElementById("sexo").value,

cpf:
document.getElementById("cpf").value.trim(),

rg:
document.getElementById("rg").value.trim(),

nacionalidade:
document.getElementById("nacionalidade").value.trim(),

naturalidade:
document.getElementById("naturalidade").value.trim(),

mae:
document.getElementById("mae").value.trim(),

pai:
document.getElementById("pai").value.trim(),

responsavel:
document.getElementById("responsavel").value.trim(),

telefone:
document.getElementById("telefone").value.trim(),

endereco:
document.getElementById("endereco").value.trim(),

numero:
document.getElementById("numero").value.trim(),

bairro:
document.getElementById("bairro").value.trim(),

cidade:
document.getElementById("cidade").value.trim(),

estado:
document.getElementById("estado").value,

cep:
document.getElementById("cep").value.trim(),

matricula:
document.getElementById("matricula").value.trim(),

turma:
document.getElementById("turma").value.trim(),

turno:
document.getElementById("turno").value,

anoLetivo:
document.getElementById("anoLetivo").value,

situacao:
document.getElementById("situacao").value

};

}


/* =========================
PREENCHER
========================= */

function preencherFormulario(aluno){

Object.keys(aluno).forEach(campo=>{

const elemento =
document.getElementById(campo);

if(elemento){

elemento.value =
aluno[campo] || "";

}

});

}


/* =========================
LIMPAR
========================= */

function limparFormulario(){

form.reset();

document.getElementById(
"nacionalidade"
).value="Brasileira";

alunoEditando=null;

document.getElementById(
"formTitle"
).textContent=
"Novo Aluno";

}


/* =========================
CARREGAR USUÁRIO
========================= */

async function carregarUsuario(user){

const ref =
doc(
db,
"usuarios",
user.uid
);

const snap =
await getDoc(ref);

if(!snap.exists()){

throw new Error(
"Usuário não encontrado."
);

}

usuarioAtual =
snap.data();


/*
MASTER
*/

if(
usuarioAtual.perfil === "master"
){

schoolName.textContent =
"Administrador Master — todas as escolas";

return;

}


/*
USUÁRIO NORMAL
*/

if(!usuarioAtual.escolaId){

throw new Error(
"Este usuário não possui escola vinculada."
);

}


const escolaRef =
doc(
db,
"escolas",
usuarioAtual.escolaId
);

const escolaSnap =
await getDoc(escolaRef);


if(!escolaSnap.exists()){

throw new Error(
"Escola vinculada não encontrada."
);

}


escolaAtual =
{

id:escolaSnap.id,

...escolaSnap.data()

};


schoolName.textContent =
escolaAtual.nome;


/* =========================
CARREGAR ALUNOS
========================= */

await carregarAlunos();

}


/* =========================
CARREGAR ALUNOS
========================= */

async function carregarAlunos(){

try{

let snapshot;


/*
MASTER
*/

if(
usuarioAtual.perfil === "master"
){

snapshot =
await getDocs(
collection(
db,
"alunos"
)
);

}


/*
ESCOLA
*/

else{

const q =
query(

collection(
db,
"alunos"
),

where(
"escolaId",
"==",
usuarioAtual.escolaId
)

);

snapshot =
await getDocs(q);

}


alunos=[];


snapshot.forEach(item=>{

alunos.push({

id:item.id,

...item.data()

});

});


renderizar();


}catch(error){

console.error(error);

mostrarMensagem(
"Erro ao carregar alunos: "+
error.message,
"error"
);

}

}


/* =========================
RENDERIZAR
========================= */

function renderizar(){

const termo =
pesquisa.value
.toLowerCase()
.trim();


const filtrados =
alunos.filter(aluno=>{

const texto =

(aluno.nome||"")+" "+

(aluno.matricula||"")+" "+

(aluno.cpf||"");


return texto
.toLowerCase()
.includes(termo);

});


lista.innerHTML="";


if(!filtrados.length){

lista.innerHTML=`

<tr>

<td
colspan="8"
class="empty"
>

Nenhum aluno encontrado.

</td>

</tr>

`;

return;

}


filtrados.forEach(aluno=>{

const tr =
document.createElement("tr");


const situacao =
aluno.situacao || "Ativo";


const classe =
situacao === "Ativo"
? "ativo"
: "inativo";


tr.innerHTML=`

<td>

<strong>
${escapar(aluno.nome||"")}
</strong>

</td>

<td>
${escapar(aluno.matricula||"-")}
</td>

<td>
${escapar(aluno.cpf||"-")}
</td>

<td>
${formatarData(aluno.dataNascimento)}
</td>

<td>
${escapar(aluno.turma||"-")}
</td>

<td>
${escapar(aluno.turno||"-")}
</td>

<td>

<span
class="status ${classe}"
>

${escapar(situacao)}

</span>

</td>

<td>

<div class="actions">

<button
class="btn btn-primary"
data-action="editar"
data-id="${aluno.id}"
>
Editar
</button>

<button
class="btn btn-warning"
data-action="situacao"
data-id="${aluno.id}"
>
${situacao==="Ativo"
?"Inativar"
:"Ativar"}
</button>

<button
class="btn btn-danger"
data-action="excluir"
data-id="${aluno.id}"
>
Excluir
</button>

</div>

</td>

`;

lista.appendChild(tr);

});

}


/* =========================
DATA
========================= */

function formatarData(data){

if(!data)
return "-";


const partes =
data.split("-");


if(partes.length!==3)
return data;


return partes[2]+"/"+
partes[1]+"/"+
partes[0];

}


/* =========================
ESCAPAR
========================= */

function escapar(valor){

return String(valor)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* =========================
SALVAR
========================= */

form.addEventListener(
"submit",
async event=>{

event.preventDefault();


if(
usuarioAtual.perfil !== "master" &&
!usuarioAtual.escolaId
){

mostrarMensagem(
"Usuário sem escola vinculada.",
"error"
);

return;

}


const dados =
pegarDados();


if(!dados.nome){

mostrarMensagem(
"Informe o nome do aluno.",
"error"
);

return;

}


if(!dados.matricula){

mostrarMensagem(
"Informe a matrícula.",
"error"
);

return;

}


try{


/*
EDITAR
*/

if(alunoEditando){

await updateDoc(

doc(
db,
"alunos",
alunoEditando
),

dados

);

mostrarMensagem(
"Aluno atualizado com sucesso."
);

}


/*
NOVO
*/

else{

await addDoc(

collection(
db,
"alunos"
),

{

...dados,

escolaId:
usuarioAtual.escolaId || null,

ativo:true,

criadoPor:
auth.currentUser.uid,

criadoEm:
serverTimestamp()

}

);

mostrarMensagem(
"Aluno cadastrado com sucesso."
);

}


limparFormulario();

formBox.style.display="none";

await carregarAlunos();


}catch(error){

console.error(error);

mostrarMensagem(

error.message,

);

}

});

/* =========================
AÇÕES
========================= */

lista.addEventListener(
"click",
async event=>{

const botao =
event.target.closest("button");

if(!botao)
return;


const id =
botao.dataset.id;

const action =
botao.dataset.action;


const aluno =
alunos.find(
item=>item.id===id
);

if(!aluno)
return;


/* EDITAR */

if(action==="editar"){

alunoEditando=id;

preencherFormulario(
aluno
);

document.getElementById(
"formTitle"
).textContent=
"Editar Aluno";

formBox.style.display="block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* SITUAÇÃO */

if(action==="situacao"){

const novoStatus =
aluno.situacao==="Ativo"
?"Inativo"
:"Ativo";


if(!confirm(
"Alterar situação do aluno para "+
novoStatus+"?"
))
return;


try{

await updateDoc(

doc(
db,
"alunos",
id
),

{

situacao:
novoStatus,

ativo:
novoStatus==="Ativo"

}

);


mostrarMensagem(
"Situação alterada."
);

await carregarAlunos();


}catch(error){

console.error(error);

mostrarMensagem(
"Erro ao alterar situação.",
"error"
);

}

}


/* EXCLUIR */

if(action==="excluir"){

if(!confirm(
"ATENÇÃO!\n\n"+
"Esta ação excluirá permanentemente o aluno.\n\n"+
"Deseja continuar?"
))
return;


try{

await deleteDoc(

doc(
db,
"alunos",
id
)

);


mostrarMensagem(
"Aluno excluído."
);

await carregarAlunos();


}catch(error){

console.error(error);

mostrarMensagem(
"Erro ao excluir aluno.",
"error"
);

}

}

});
