<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAdwrOqN4-VQsiBByk4FVGACDvfrR8ZYac",

    authDomain:
        "dasorte-66ec5.firebaseapp.com",

    projectId:
        "dasorte-66ec5",

    storageBucket:
        "dasorte-66ec5.firebasestorage.app",

    messagingSenderId:
        "606389335961",

    appId:
        "1:606389335961:web:feac4e89f8b4fa74684508"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual = null;

let dadosUsuario = null;

let escolaAtualId = null;

let escolaAtualNome = "";

let alunos = [];

let alunoEditando = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const form =
    document.getElementById("alunoForm");

const formBox =
    document.getElementById("formBox");

const lista =
    document.getElementById("listaAlunos");

const pesquisa =
    document.getElementById("pesquisa");

const message =
    document.getElementById("message");

const schoolInfo =
    document.getElementById("schoolInfo");


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo = "success"
){

    message.textContent =
        texto;

    message.className =
        "message " + tipo;

    setTimeout(() => {

        message.className =
            "message";

    }, 5000);

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   CARREGAR PERFIL DO USUÁRIO
===================================================== */

async function carregarPerfil(){

    const ref =
        doc(
            db,
            "usuarios",
            usuarioAtual.uid
        );

    const snap =
        await getDoc(ref);


    if(!snap.exists()){

        throw new Error(
            "Cadastro do usuário não encontrado."
        );

    }


    dadosUsuario =
        snap.data();


    if(
        dadosUsuario.ativo === false
    ){

        throw new Error(
            "Este usuário está desativado."
        );

    }


    if(
        dadosUsuario.perfil !== "master" &&
        dadosUsuario.perfil !== "administrador"
    ){

        throw new Error(
            "Usuário sem permissão para acessar alunos."
        );

    }


    /*
     * MASTER
     *
     * O Master não possui uma escola
     * obrigatória.
     */

    if(
        dadosUsuario.perfil === "master"
    ){

        schoolInfo.innerHTML =
            "👑 Usuário Master — visualização de todas as escolas.";

        return;

    }


    /*
     * ADMINISTRADOR
     *
     * O escolaId vem do Firestore,
     * nunca do formulário.
     */

    escolaAtualId =
        dadosUsuario.escolaId;


    if(!escolaAtualId){

        throw new Error(
            "Este administrador não está vinculado a uma escola."
        );

    }


    const escolaSnap =
        await getDoc(
            doc(
                db,
                "escolas",
                escolaAtualId
            )
        );


    if(!escolaSnap.exists()){

        throw new Error(
            "A escola vinculada não foi encontrada."
        );

    }


    const escola =
        escolaSnap.data();


    if(escola.ativa === false){

        throw new Error(
            "A escola está desativada."
        );

    }


    escolaAtualNome =
        escola.nome || "";


    schoolInfo.innerHTML =
        "🏫 Escola: " +
        escapar(escolaAtualNome);

}


/* =====================================================
   CARREGAR ALUNOS
===================================================== */

async function carregarAlunos(){

    let consulta;


    /*
     * ADMINISTRADOR:
     *
     * Busca somente os alunos
     * da própria escola.
     */

    if(
        dadosUsuario.perfil ===
        "administrador"
    ){

        consulta =
            query(
                collection(
                    db,
                    "alunos"
                ),
                where(
                    "escolaId",
                    "==",
                    escolaAtualId
                )
            );

    }


    /*
     * MASTER:
     *
     * Pode consultar todos.
     */

    else{

        consulta =
            collection(
                db,
                "alunos"
            );

    }


    const snapshot =
        await getDocs(
            consulta
        );


    alunos = [];


    snapshot.forEach(
        item => {

            alunos.push({

                id:item.id,

                ...item.data()

            });

        }
    );


    /*
     * Ordenação local por nome.
     */

    alunos.sort(
        (a,b) =>
            (a.nome || "")
            .localeCompare(
                b.nome || "",
                "pt-BR"
            )
    );


    renderizarAlunos();

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarAlunos(){

    const termo =
        pesquisa.value
            .toLowerCase()
            .trim();


    const filtrados =
        alunos.filter(
            aluno => {

                const texto =
                    (
                        aluno.nome || ""
                    ) +
                    " " +
                    (
                        aluno.matricula || ""
                    );


                return texto
                    .toLowerCase()
                    .includes(termo);

            }
        );


    lista.innerHTML = "";


    if(!filtrados.length){

        lista.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty"
                >
                    Nenhum aluno encontrado.
                </td>

            </tr>

        `;

        return;

    }


    filtrados.forEach(
        aluno => {

            const tr =
                document.createElement(
                    "tr"
                );


            const ativo =
                aluno.situacao !==
                "Inativo";


            tr.innerHTML = `

                <td>
                    ${escapar(
                        aluno.matricula
                    )}
                </td>

                <td>
                    <strong>
                        ${escapar(
                            aluno.nome
                        )}
                    </strong>
                </td>

                <td>
                    ${escapar(
                        aluno.dataNascimento ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapar(
                        aluno.anoLetivo ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapar(
                        aluno.turma ||
                        "-"
                    )}
                </td>

                <td>

                    <span class="
                        status
                        ${
                            ativo
                            ? "active"
                            : "inactive"
                        }
                    ">

                        ${escapar(
                            aluno.situacao ||
                            "Ativo"
                        )}

                    </span>

                </td>

                <td>

                    <div class="actions">

                        <button
                            class="btn btn-primary"
                            data-action="editar"
                            data-id="${aluno.id}"
                        >
                            Editar
                        </button>

                        <button
                            class="btn btn-danger"
                            data-action="excluir"
                            data-id="${aluno.id}"
                        >
                            Excluir
                        </button>

                    </div>

                </td>

            `;


            lista.appendChild(tr);

        }
    );

}

   DADOS DO FORMULÁRIO
===================================================== */

        responsavel:

        telefoneResponsavel:

        endereco:
            document

            .value
            .trim(),

        numero:

/* =====================================================
   PREENCHER FORMULÁRIO
===================================================== */

function preencherFormulario(
    aluno
){

    const campos = {

        matricula:aluno.matricula,
        nome:aluno.nome,
        dataNascimento:aluno.dataNascimento,
        sexo:aluno.sexo,
        cpf:aluno.cpf,
        rg:aluno.rg,
        naturalidade:aluno.naturalidade,
        nacionalidade:aluno.nacionalidade,
        nomeMae:aluno.nomeMae,
        nomePai:aluno.nomePai,
        responsavel:aluno.responsavel,
        telefoneResponsavel:aluno.telefoneResponsavel,
        endereco:aluno.endereco,
        numero:aluno.numero,
        bairro:aluno.bairro,
        cidade:aluno.cidade,
        estado:aluno.estado,
        cep:aluno.cep,
        telefone:aluno.telefone,
        email:aluno.email,
        dataMatricula:aluno.dataMatricula,
        anoLetivo:aluno.anoLetivo,
        turma:aluno.turma,
        situacao:aluno.situacao,
        observacoes:aluno.observacoes

    };


    Object.entries(
        campos
    ).forEach(
        ([campo,valor]) => {

            const elemento =
                document.getElementById(
                    campo
                );

            if(elemento){

                elemento.value =
                    valor ?? "";

            }

        }
    );

}


/* =====================================================
   LIMPAR
===================================================== */

function limparFormulario(){

    form.reset();

    document
        .getElementById(
            "nacionalidade"
        )

    document

    alunoEditando = null;

    document

}

/* =====================================================
   SALVAR
===================================================== */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const dados =
            pegarDados();


        if(
            !dados.matricula ||
            !dados.nome
        ){

            mostrarMensagem(
                "Informe a matrícula e o nome do aluno.",
                "error"
            );

            return;

        }


        try{

            /*
             * ADMINISTRADOR:
             *
             * O escolaId é sempre
             * obtido do perfil.
             */

            if(
                dadosUsuario.perfil ===
                "administrador"
            ){

                dados.escolaId =
                    escolaAtualId;

            }


            /*
             * MASTER:
             *
             * Para o Master vamos exigir
             * que uma escola seja definida
             * posteriormente através de
             * uma seleção própria.
             *
             * Por segurança, nesta primeira
             * versão o Master não poderá
             * criar aluno sem escola.
             */

            if(
                dadosUsuario.perfil ===
                "master"
                &&
                !dados.escolaId
            ){

                /*
                 * Para não colocar uma escola
                 * arbitrariamente, pedimos que
                 * o cadastro seja feito pelo
                 * administrador da escola.
                 */

                mostrarMensagem(
                    "O cadastro de aluno pelo Master será habilitado na próxima etapa com seleção da escola.",
                    "error"
                );

                return;

            }


            if(alunoEditando){

                /*
                 * Mantém o escolaId existente.
                 */

                const alunoOriginal =
                    alunos.find(
                        item =>
                            item.id ===
                            alunoEditando
                    );


                if(
                    dadosUsuario.perfil ===
                    "administrador"
                ){

                    if(
                        !alunoOriginal ||
                        alunoOriginal.escolaId !==
                        escolaAtualId
                    ){

                        mostrarMensagem(
                            "Você não pode editar este aluno.",
                            "error"
                        );

                        return;

                    }

                }


                await updateDoc(

                    doc(
                        db,
                        "alunos",
                        alunoEditando
                    ),

                    dados

                );


                mostrarMensagem(
                    "Aluno atualizado com sucesso."
                );

            }

            else{

                dados.criadoEm =
                    serverTimestamp();


                await addDoc(

                    collection(
                        db,
                        "alunos"
                    ),

                    dados

                );


                mostrarMensagem(
                    "Aluno cadastrado com sucesso."
                );

            }


            limparFormulario();

            formBox.style.display =
                "none";


            await carregarAlunos();


        }catch(error){

            console.error(error);

            mostrarMensagem(
                "Erro ao salvar aluno: " +
                error.message,
                "error"
            );

        }

    }
);


/* =====================================================
   PESQUISA
===================================================== */

pesquisa.addEventListener(
    "input",
    renderizarAlunos
);


/* =====================================================
   AÇÕES
===================================================== */

lista.addEventListener(
    "click",
    async event => {

        const botao =
            event.target.closest(
                "button"
            );

        if(!botao)
            return;


        const id =
            botao.dataset.id;

        const action =
            botao.dataset.action;


        const aluno =
            alunos.find(
                item =>
                    item.id === id
            );


        if(!aluno)
            return;


        /* EDITAR */

        if(
            action ===
            "editar"
        ){

            /*
             * Segurança adicional
             * no lado do cliente.
             */

            if(
                dadosUsuario.perfil ===
                "administrador"
                &&
                aluno.escolaId !==
                escolaAtualId
            ){

                mostrarMensagem(
                    "Você não pode editar este aluno.",
                    "error"
                );

                return;

            }


            alunoEditando =
                id;


            preencherFormulario(
                aluno
            );


            document
                .getElementById(
                    "formTitle"
                )
                .textContent =
                "Editar Aluno";


            formBox.style.display =
                "block";


            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }


        /* EXCLUIR */

        if(
            action ===
            "excluir"
        ){

            const confirmar =
                confirm(
                    "Deseja realmente excluir este aluno?"
                );


            if(!confirmar)
                return;


            try{

                /*
                 * Segurança adicional.
                 */

                if(
                    dadosUsuario.perfil ===
                    "administrador"
                    &&
                    aluno.escolaId !==
                    escolaAtualId
                ){

                    mostrarMensagem(
                        "Você não pode excluir este aluno.",
                        "error"
                    );

                    return;

                }


                await deleteDoc(

                    doc(
                        db,
                        "alunos",
                        id
                    )

                );


                mostrarMensagem(
                    "Aluno excluído com sucesso."
                );


                await carregarAlunos();


            }catch(error){

                console.error(error);

                mostrarMensagem(
                    "Erro ao excluir aluno: " +
                    error.message,
                    "error"
                );

            }

        }

    }
);


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            alert(
                "Você precisa estar logado."
            );

            window.location.href =
                "index.html";

            return;

        }


        usuarioAtual =
            user;


        try{

            await carregarPerfil();

            await carregarAlunos();

        }catch(error){

            console.error(error);

            schoolInfo.textContent =
                "⛔ " + error.message;

            mostrarMensagem(
                error.message,
                "error"
            );

            document
                .getElementById(
                    "btnNovo"
                )
                .style.display =
                "none";

        }

    }
);
