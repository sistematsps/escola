<style>

    margin:0;
    padding:0;
}

body{

}

/* =========================
   HEADER
========================= */

header{
    background:#0f172a;
    color:white;
    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-title span{
    font-size:30px;
}

.header-title h1{
    font-size:20px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.usuario{
    text-align:right;
}

.usuario strong{
    display:block;
}

.usuario small{
    color:#cbd5e1;
}

/* =========================
   BOTÕES
========================= */

.btn{
    border:none;
    padding:11px 16px;
    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-secondary{
    background:#64748b;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-warning{
    background:#d97706;
    color:white;
}

.btn-info{
    background:#0891b2;
    color:white;
}

.btn-purple{
    background:#7c3aed;
    color:white;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1500px;
    margin:auto;
    padding:25px;
}

/* =========================
   TOPO
========================= */

.top-area{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:20px;
}

.top-area h2{
    font-size:25px;
}

/* =========================
   ESCOLA
========================= */

.school-box{

    background:white;

    padding:15px 20px;

/* =========================
   PESQUISA
========================= */

}

    border:1px solid #cbd5e1;

    border-radius:9px;

    font-size:15px;

    outline:none;

}

.search input:focus{

/* =========================
   FORMULÁRIO
========================= */

.form-box{

    display:none;

    background:white;

    padding:25px;

    border-radius:14px;

    margin-bottom:25px;

    box-shadow:0 5px 20px rgba(0,0,0,.06);

}

.form-box h3{
    margin-bottom:20px;
}

.form-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;

}

.form-group label{

    display:block;

    margin-bottom:6px;

    font-weight:bold;

    font-size:14px;

}

.form-group input,
.form-group select{

    width:100%;

    padding:12px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    outline:none;

    font-size:14px;

}

.form-group input:focus,
.form-group select:focus{

    border-color:#2563eb;

}

.full{
    grid-column:1/-1;
}

.form-buttons{

    margin-top:20px;

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}

/* =========================
   TABELA
========================= */

.table-box{

    background:white;

    border-radius:14px;

    overflow:hidden;

    box-shadow:0 5px 20px rgba(0,0,0,.06);

}

.table-container{

    width:100%;

    overflow-x:auto;

table{

    width:100%;

th{

    padding:13px;

td{

========================= */

}

.status.inactive{

/* =========================

========================= */

.message{

    }

    .full{

    }

}

/* =====================================================
   CARREGAR ESCOLA
===================================================== */

async function carregarEscola(){

    if(!dadosUsuario)
        return;


    /*
     * MASTER
     *
     * Master não possui escolaId obrigatório.
     */

    if(dadosUsuario.perfil === "master"){

        escolaAtual = null;

        document
            .getElementById("escolaInfo")
            .textContent =
            "Administrador Master — acesso às escolas cadastradas.";

        return;

    }


    if(!dadosUsuario.escolaId){

        document
            .getElementById("escolaInfo")
            .textContent =
            "Este usuário ainda não está vinculado a uma escola.";

        mostrarMensagem(
            "Usuário sem escola vinculada.",
            "error"
        );

        return;

    }


    escolaAtual =
        dadosUsuario.escolaId;


    try{

        const escolaRef =
            doc(
                db,
                "escolas",
                escolaAtual
            );


        const escolaSnap =
            await getDoc(escolaRef);


        if(escolaSnap.exists()){

            const escola =
                escolaSnap.data();


            document
                .getElementById("escolaInfo")
                .textContent =
                escola.nome ||
                escola.nomeFantasia ||
                escolaAtual;

        }else{

            document
                .getElementById("escolaInfo")
                .textContent =
                "Escola não encontrada.";

        }

    }catch(error){

        console.error(error);

        document
            .getElementById("escolaInfo")
            .textContent =
            "Não foi possível carregar a escola.";

    }

}


/* =====================================================
   CARREGAR ALUNOS
===================================================== */

async function carregarAlunos(){

    try{

        let snapshot;


        /*
         * MASTER
         *
         * Consulta todos os alunos.
         */

        if(dadosUsuario.perfil === "master"){

            snapshot =
                await getDocs(
                    collection(
                        db,
                        "alunos"
                    )
                );

        }

        /*
         * USUÁRIO NORMAL
         *
         * Consulta somente a escola vinculada.
         */

        else{

            if(!dadosUsuario.escolaId){

                alunos = [];

                renderizar();

                return;

            }


            const consulta =
                query(

                    collection(
                        db,
                        "alunos"
                    ),

                    where(
                        "escolaId",
                        "==",
                        dadosUsuario.escolaId
                    )

                );


            snapshot =
                await getDocs(
                    consulta
                );

        }


        alunos = [];


        snapshot.forEach(item => {

            alunos.push({

                id:item.id,

                ...item.data()

            });

        });


        renderizar();


    }catch(error){

        console.error(
            "Erro ao carregar alunos:",
            error
        );


        mostrarMensagem(
            "Erro ao carregar alunos: " +
            (error.message || ""),
            "error"
        );

    }

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor){

    return String(valor)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizar(){

    const termo =
        pesquisa.value
            .toLowerCase()
            .trim();


    const filtrados =
        alunos.filter(aluno => {

            const texto =

                (aluno.nome || "") +
                " " +
                (aluno.matricula || "") +
                " " +
                (aluno.cpf || "") +
                " " +
                (aluno.mae || "");


            return texto
                .toLowerCase()
                .includes(termo);

        });


    lista.innerHTML = "";


    if(!filtrados.length){

        lista.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty"
                >

                    Nenhum aluno encontrado.

                </td>

            </tr>

        `;

        return;

    }


    filtrados.forEach(aluno => {

        const tr =
            document.createElement("tr");


        const ativo =
            aluno.situacao === "Ativo";


        tr.innerHTML = `

            <td>

                <strong>
                    ${escapar(aluno.nome || "")}
                </strong>

                ${
                    aluno.nomeSocial
                    ?
                    `<br>
                     <small>
                        ${escapar(aluno.nomeSocial)}
                     </small>`
                    :
                    ""
                }

            </td>


            <td>
                ${escapar(aluno.matricula || "-")}
            </td>


            <td>
                ${escapar(aluno.cpf || "-")}
            </td>


            <td>
                ${escapar(aluno.dataNascimento || "-")}
            </td>


            <td>
                ${escapar(aluno.mae || "-")}
            </td>


            <td>

                <span class="
                    status
                    ${ativo ? "active" : "inactive"}
                ">

                    ${escapar(aluno.situacao || "Ativo")}

                </span>

            </td>


            <td>

                <div class="actions">


                    <button
                        class="btn btn-primary"
                        data-action="editar"
                        data-id="${aluno.id}"
                    >
                        Editar
                    </button>


                    <button
                        class="btn btn-info"
                        data-action="historico"
                        data-id="${aluno.id}"
                    >
                        Histórico
                    </button>


                    <button
                        class="btn btn-purple"
                        data-action="declaracao"
                        data-id="${aluno.id}"
                    >
                        Declaração
                    </button>


                    <button
                        class="btn btn-danger"
                        data-action="excluir"
                        data-id="${aluno.id}"
                    >
                        Excluir
                    </button>


                </div>

            </td>

        `;


        lista.appendChild(tr);

    });

}

/* =====================================================
   SALVAR
===================================================== */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const dados =
            pegarDados();


        if(!dados.nome){

            mostrarMensagem(
                "Digite o nome do aluno.",
                "error"
            );

            return;

        }


        if(!dados.matricula){

            mostrarMensagem(
                "Digite a matrícula do aluno.",
                "error"
            );

            return;

        }


        /*
         * Usuário normal precisa
         * obrigatoriamente de uma escola.
         */

        if(
            dadosUsuario.perfil !== "master" &&
            !dadosUsuario.escolaId
        ){

            mostrarMensagem(
                "Este usuário não possui escola vinculada.",
                "error"
            );

            return;

        }


        try{


            if(alunoEditando){

                /*
                 * Não alteramos escolaId
                 * durante a edição.
                 */

                await updateDoc(

                    doc(
                        db,
                        "alunos",
                        alunoEditando
                    ),

                    dados

                );


                mostrarMensagem(
                    "Aluno atualizado com sucesso."
                );


            }else{


                /*
                 * MASTER precisa informar uma escola
                 * futuramente através do módulo
                 * administrativo.
                 *
                 * Por enquanto, o cadastro Master
                 * exige que exista escola selecionada.
                 */

                if(
                    dadosUsuario.perfil === "master" &&
                    !escolaAtual
                ){

                    mostrarMensagem(
                        "Para o usuário Master, selecione uma escola antes de cadastrar o aluno.",
                        "error"
                    );

                    return;

                }


                await addDoc(

                    collection(
                        db,
                        "alunos"
                    ),

                    {

                        ...dados,

                        escolaId:
                            escolaAtual ||
                            dadosUsuario.escolaId,

                        criadoPor:
                            usuarioAtual.uid,

                        criadoEm:
                            serverTimestamp()

                    }

                );


                mostrarMensagem(
                    "Aluno cadastrado com sucesso."
                );

            }


            limparFormulario();


            formBox.style.display =
                "none";


            await carregarAlunos();


        }catch(error){

            console.error(
                "Erro ao salvar aluno:",
                error
            );


            mostrarMensagem(
                "Erro ao salvar aluno: " +
                (error.message || ""),
                "error"
            );

        }

    }
);


/* =====================================================
   AÇÕES
===================================================== */

lista.addEventListener(
    "click",
    async event => {


        const botao =
            event.target.closest("button");


        if(!botao)
            return;


        const id =
            botao.dataset.id;


        const action =
            botao.dataset.action;


        const aluno =
            alunos.find(
                item => item.id === id
            );


        if(!aluno)
            return;


        /* =====================
           EDITAR
        ===================== */

        if(action === "editar"){

            alunoEditando =
                id;


            preencherFormulario(
                aluno
            );


            document
                .getElementById("formTitle")
                .textContent =
                "Editar Aluno";


            formBox.style.display =
                "block";


            window.scrollTo({

                top:0,

                behavior:"smooth"

            });

        }


        /* =====================
           HISTÓRICO
        ===================== */

        if(action === "historico"){

            /*
             * Próxima etapa:
             * historico.html
             */

            window.location.href =
                "historico.html?alunoId=" +
                encodeURIComponent(id);

        }


        /* =====================
           DECLARAÇÃO
        ===================== */

        if(action === "declaracao"){

            /*
             * Próxima etapa:
             * declaracao.html
             */

            window.location.href =
                "declaracao.html?alunoId=" +
                encodeURIComponent(id);

        }


        /* =====================
           EXCLUIR
        ===================== */

        if(action === "excluir"){

            const confirmacao =
                confirm(

                    "ATENÇÃO!\n\n" +

                    "Deseja realmente excluir o aluno:\n\n" +

                    aluno.nome +

                    "\n\n" +

                    "Esta operação não poderá ser desfeita."

                );


            if(!confirmacao)
                return;


            try{


                await deleteDoc(

                    doc(
                        db,
                        "alunos",
                        id
                    )

                );


                mostrarMensagem(
                    "Aluno excluído com sucesso."
                );


                await carregarAlunos();


            }catch(error){

                console.error(error);


                mostrarMensagem(
                    "Erro ao excluir aluno: " +
                    (error.message || ""),
                    "error"
                );

            }

        }

    }
);


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
    auth,
    async user => {


        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        usuarioAtual =
            user;


        try{


            const userRef =
                doc(
                    db,
                    "usuarios",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(!userSnap.exists()){

                alert(
                    "Usuário não possui cadastro no sistema."
                );

                window.location.href =
                    "index.html";

                return;

            }


            dadosUsuario =
                userSnap.data();


            /*
             * Exibe usuário
             */

            document
                .getElementById("nomeUsuario")
                .textContent =
                dadosUsuario.nome ||
                user.email;


            document
                .getElementById("perfilUsuario")
                .textContent =
                dadosUsuario.perfil ||
                "Usuário";


            /*
             * Carrega escola
             */

            await carregarEscola();


            /*
             * Carrega alunos
             */

            await carregarAlunos();


        }catch(error){

            console.error(error);


            mostrarMensagem(
                "Erro ao carregar dados: " +
                (error.message || ""),
                "error"
            );

        }

    }
);
