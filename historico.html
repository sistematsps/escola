<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Histórico Escolar</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

header{
    background:#0f172a;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-title span{
    font-size:30px;
}

.header-title h1{
    font-size:20px;
}

.btn{
    border:none;
    padding:11px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-warning{
    background:#d97706;
    color:white;
}

.btn-secondary{
    background:#64748b;
    color:white;
}

main{
    max-width:1400px;
    margin:auto;
    padding:25px;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.top h2{
    font-size:25px;
}

.box{
    background:white;
    padding:22px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.box h3{
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#2563eb;
}

.full{
    grid-column:1/-1;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.table-container{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#e2e8f0;
    padding:12px;
    text-align:left;
    font-size:13px;
}

td{
    padding:10px;
    border-top:1px solid #e2e8f0;
    font-size:14px;
}

.actions{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.actions .btn{
    padding:7px 10px;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.aluno-info{
    background:#eff6ff;
    border-left:5px solid #2563eb;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
}

.aluno-info strong{
    display:block;
    font-size:18px;
    margin-bottom:5px;
}

.disciplinas{
    margin-top:20px;
}

.disciplina-linha{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 50px;
    gap:10px;
    margin-bottom:10px;
    align-items:end;
}

.disciplina-linha input,
.disciplina-linha select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
}

.nota{
    text-align:center;
}

.media-box{
    margin-top:15px;
    background:#f8fafc;
    padding:15px;
    border-radius:8px;
}

.media-box strong{
    font-size:18px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status.aprovado{
    background:#dcfce7;
    color:#166534;
}

.status.reprovado{
    background:#fee2e2;
    color:#991b1b;
}

.status.recuperacao{
    background:#fef3c7;
    color:#92400e;
}

.status.cursando{
    background:#dbeafe;
    color:#1e40af;
}

#areaEditor{
    display:none;
}

#areaHistoricos{
    display:block;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .disciplina-linha{
        grid-template-columns:1fr;
    }

    header{
        flex-direction:column;
        align-items:flex-start;
    }

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-title">

        <span>📚</span>

        <h1>
            Histórico Escolar
        </h1>

    </div>

    <button
        class="btn btn-secondary"
        onclick="voltarPainel()"
    >
        ← Painel
    </button>

</header>


<main>

<div id="message" class="message"></div>


<!-- =========================
     LISTA DE HISTÓRICOS
========================= -->

<section id="areaHistoricos">

    <div class="top">

        <h2>
            Históricos dos Alunos
        </h2>

        <button
            class="btn btn-primary"
            onclick="novoHistorico()"
        >
            + Novo Histórico
        </button>

    </div>


    <div class="box">

        <div class="form-group">

            <label>
                Pesquisar aluno
            </label>

            <input
                type="text"
                id="pesquisa"
                placeholder="Digite o nome do aluno..."
            >

        </div>

    </div>


    <div class="box">

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Aluno</th>

                        <th>Ano/Série</th>

                        <th>Disciplinas</th>

                        <th>Situação</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaHistoricos">

                </tbody>

            </table>

        </div>

    </div>

</section>


<!-- =========================
     EDITOR
========================= -->

<section id="areaEditor">

    <div class="top">

        <h2 id="tituloEditor">
            Novo Histórico
        </h2>

        <button
            class="btn btn-secondary"
            onclick="fecharEditor()"
        >
            ← Voltar
        </button>

    </div>


    <!-- ALUNO -->

    <div class="box">

        <h3>
            👨‍🎓 Aluno
        </h3>

        <div class="grid">

            <div class="form-group full">

                <label>
                    Selecionar aluno *
                </label>

                <select id="aluno">

                    <option value="">
                        Selecione o aluno
                    </option>

                </select>

            </div>

        </div>

        <div
            id="alunoInfo"
            class="aluno-info"
            style="display:none"
        >

            <strong id="nomeAlunoInfo"></strong>

            <span id="dadosAlunoInfo"></span>

        </div>

    </div>


    <!-- ANO -->

    <div class="box">

        <h3>
            📅 Ano Letivo
        </h3>

        <div class="grid">

            <div class="form-group">

                <label>
                    Ano letivo *
                </label>

                <input
                    type="number"
                    id="ano"
                    min="1900"
                    max="2100"
                >

            </div>


            <div class="form-group">

                <label>
                    Série/Ano *
                </label>

                <select id="serie">

                    <option value="">
                        Selecione
                    </option>

                    <option>1º Ano</option>
                    <option>2º Ano</option>
                    <option>3º Ano</option>
                    <option>4º Ano</option>
                    <option>5º Ano</option>
                    <option>6º Ano</option>
                    <option>7º Ano</option>
                    <option>8º Ano</option>
                    <option>9º Ano</option>

                    <option>1ª Série</option>
                    <option>2ª Série</option>
                    <option>3ª Série</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Turno
                </label>

                <select id="turno">

                    <option value="">
                        Selecione
                    </option>

                    <option>Matutino</option>
                    <option>Vespertino</option>
                    <option>Noturno</option>
                    <option>Integral</option>

                </select>

            </div>

        </div>

    </div>


    <!-- DISCIPLINAS -->

    <div class="box">

        <h3>
            📝 Disciplinas e Notas
        </h3>

        <div id="disciplinas"></div>


        <button
            type="button"
            class="btn btn-primary"
            onclick="adicionarDisciplina()"
        >
            + Adicionar Disciplina
        </button>


        <div class="media-box">

            Média geral:
            <strong id="mediaGeral">
                0,00
            </strong>

        </div>

    </div>


    <!-- SITUAÇÃO -->

    <div class="box">

        <h3>
            📊 Resultado
        </h3>

        <div class="grid">

            <div class="form-group">

                <label>
                    Situação
                </label>

                <select id="situacao">

                    <option value="Aprovado">
                        Aprovado
                    </option>

                    <option value="Reprovado">
                        Reprovado
                    </option>

                    <option value="Recuperação">
                        Recuperação
                    </option>

                    <option value="Cursando">
                        Cursando
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Frequência (%)
                </label>

                <input
                    type="number"
                    id="frequencia"
                    min="0"
                    max="100"
                    step="0.01"
                >

            </div>


            <div class="form-group">

                <label>
                    Observações
                </label>

                <input
                    type="text"
                    id="observacoes"
                    placeholder="Observações..."
                >

            </div>

        </div>


        <div class="buttons">

            <button
                class="btn btn-success"
                onclick="salvarHistorico()"
            >
                💾 Salvar Histórico
            </button>

            <button
                class="btn btn-primary"
                onclick="visualizarHistorico()"
            >
                📄 Visualizar / Imprimir
            </button>

            <button
                class="btn btn-secondary"
                onclick="fecharEditor()"
            >
                Cancelar
            </button>

        </div>

    </div>

</section>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    getDoc,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAdwrOqN4-VQsiBByk4FVG-cDvfrdR8ZYac",

    authDomain:
        "dasorte-66ec5.firebaseapp.com",

    projectId:
        "dasorte-66ec5",

    storageBucket:
        "dasorte-66ec5.firebasestorage.app",

    messagingSenderId:
        "606389335961",

    appId:
        "1:606389335961:web:feac4e89f8b4fa74684508"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   VARIÁVEIS
========================= */

let usuarioAtual = null;

let escolaId = null;

let alunos = [];

let historicos = [];

let historicoEditando = null;


/* =========================
   ELEMENTOS
========================= */

const alunoSelect =
    document.getElementById("aluno");

const disciplinasDiv =
    document.getElementById("disciplinas");

const listaHistoricos =
    document.getElementById("listaHistoricos");

const areaEditor =
    document.getElementById("areaEditor");

const areaHistoricos =
    document.getElementById("areaHistoricos");


/* =========================
   MENSAGEM
========================= */

function mensagem(texto, tipo="success"){

    const elemento =
        document.getElementById("message");

    elemento.textContent =
        texto;

    elemento.className =
        "message " + tipo;

    setTimeout(()=>{

        elemento.className =
            "message";

    },4000);

}


/* =========================
   AUTENTICAÇÃO
========================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        try{

            const ref =
                doc(
                    db,
                    "usuarios",
                    user.uid
                );

            const snap =
                await getDoc(ref);

            if(!snap.exists()){

                alert(
                    "Usuário não encontrado."
                );

                window.location.href =
                    "index.html";

                return;

            }

            usuarioAtual =
                snap.data();

            escolaId =
                usuarioAtual.escolaId;

            /*
             * O Master pode não possuir escolaId.
             * Nesse caso ele deverá estar vinculado
             * a uma escola antes de trabalhar com
             * alunos/históricos.
             */

            if(!escolaId){

                mensagem(
                    "Este usuário ainda não possui uma escola vinculada.",
                    "error"
                );

                return;

            }

            await carregarAlunos();

            await carregarHistoricos();

        }catch(error){

            console.error(error);

            mensagem(
                "Erro ao carregar dados: "+
                error.message,
                "error"
            );

        }

    }
);


/* =========================
   CARREGAR ALUNOS
========================= */

async function carregarAlunos(){

    alunos=[];

    const q =
        query(
            collection(db,"alunos"),
            where(
                "escolaId",
                "==",
                escolaId
            )
        );

    const snap =
        await getDocs(q);

    snap.forEach(item=>{

        alunos.push({

            id:item.id,

            ...item.data()

        });

    });

    alunos.sort(
        (a,b)=>
            (a.nome||"")
            .localeCompare(
                b.nome||"",
                "pt-BR"
            )
    );

    preencherAlunos();

}


/* =========================
   PREENCHER ALUNOS
========================= */

function preencherAlunos(){

    alunoSelect.innerHTML=`

        <option value="">
            Selecione o aluno
        </option>

    `;

    alunos.forEach(aluno=>{

        const option =
            document.createElement("option");

        option.value =
            aluno.id;

        option.textContent =
            aluno.nome || "Aluno sem nome";

        alunoSelect.appendChild(option);

    });

}


/* =========================
   INFORMAÇÕES DO ALUNO
========================= */

alunoSelect.addEventListener(
    "change",
    ()=>{

        const aluno =
            alunos.find(
                a =>
                a.id === alunoSelect.value
            );

        const info =
            document.getElementById("alunoInfo");

        if(!aluno){

            info.style.display =
                "none";

            return;

        }

        info.style.display =
            "block";

        document
            .getElementById("nomeAlunoInfo")
            .textContent =
            aluno.nome || "";

        document
            .getElementById("dadosAlunoInfo")
            .textContent =

            "CPF: " +
            (aluno.cpf || "-") +

            " | Nascimento: " +
            (aluno.dataNascimento || "-");

    }
);


/* =========================
   CARREGAR HISTÓRICOS
========================= */

async function carregarHistoricos(){

    historicos=[];

    const q =
        query(
            collection(db,"historicos"),
            where(
                "escolaId",
                "==",
                escolaId
            )
        );

    const snap =
        await getDocs(q);

    snap.forEach(item=>{

        historicos.push({

            id:item.id,

            ...item.data()

        });

    });

    renderizarHistoricos();

}


/* =========================
   RENDERIZAR
========================= */

function renderizarHistoricos(){

    const pesquisa =
        document
            .getElementById("pesquisa")
            .value
            .toLowerCase()
            .trim();

    const filtrados =
        historicos.filter(h=>{

            return (
                h.nomeAluno || ""
            )
            .toLowerCase()
            .includes(pesquisa);

        });


    listaHistoricos.innerHTML="";


    if(!filtrados.length){

        listaHistoricos.innerHTML=`

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >
                    Nenhum histórico encontrado.
                </td>

            </tr>

        `;

        return;

    }


    filtrados.forEach(h=>{

        const tr =
            document.createElement("tr");

        const situacao =
            h.situacao || "Cursando";


        let classe =
            situacao
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g,"")
                .replace(" ","");


        tr.innerHTML=`

            <td>

                <strong>
                    ${escapar(
                        h.nomeAluno || ""
                    )}
                </strong>

            </td>

            <td>

                ${escapar(
                    String(h.ano || "")
                )}

                -

                ${escapar(
                    h.serie || ""
                )}

            </td>

            <td>
                ${
                    Array.isArray(h.disciplinas)
                    ? h.disciplinas.length
                    : 0
                }
            </td>

            <td>

                <span
                    class="status ${classe}"
                >
                    ${escapar(situacao)}
                </span>

            </td>

            <td>

                <div class="actions">

                    <button
                        class="btn btn-primary"
                        data-id="${h.id}"
                        data-action="editar"
                    >
                        Editar
                    </button>

                    <button
                        class="btn btn-success"
                        data-id="${h.id}"
                        data-action="visualizar"
                    >
                        📄 Documento
                    </button>

                    <button
                        class="btn btn-danger"
                        data-id="${h.id}"
                        data-action="excluir"
                    >
                        Excluir
                    </button>

                </div>

            </td>

        `;

        listaHistoricos.appendChild(tr);

    });

}


/* =========================
   PESQUISA
========================= */

document
    .getElementById("pesquisa")
    .addEventListener(
        "input",
        renderizarHistoricos
    );


/* =========================
   NOVO HISTÓRICO
========================= */

window.novoHistorico =
function(){

    historicoEditando=null;

    areaHistoricos.style.display =
        "none";

    areaEditor.style.display =
        "block";

    document
        .getElementById("tituloEditor")
        .textContent =
        "Novo Histórico";

    limparFormulario();

    adicionarDisciplina();

};


/* =========================
   LIMPAR
========================= */

function limparFormulario(){

    alunoSelect.value="";

    document
        .getElementById("ano")
        .value =
        new Date().getFullYear();

    document
        .getElementById("serie")
        .value="";

    document
        .getElementById("turno")
        .value="";

    document
        .getElementById("situacao")
        .value="Aprovado";

    document
        .getElementById("frequencia")
        .value="";

    document
        .getElementById("observacoes")
        .value="";

    disciplinasDiv.innerHTML="";

    document
        .getElementById("mediaGeral")
        .textContent =
        "0,00";

    document
        .getElementById("alunoInfo")
        .style.display =
        "none";

}


/* =========================
   ADICIONAR DISCIPLINA
========================= */

window.adicionarDisciplina =
function(
    disciplina="",
    nota1="",
    nota2="",
    notaFinal=""
){

    const div =
        document.createElement("div");

    div.className =
        "disciplina-linha";


    div.innerHTML=`

        <div>

            <label>
                Disciplina
            </label>

            <input
                type="text"
                class="nome-disciplina"
                value="${escapar(disciplina)}"
                placeholder="Ex.: Matemática"
            >

        </div>


        <div>

            <label>
                Nota 1
            </label>

            <input
                type="number"
                class="nota nota1"
                value="${nota1}"
                min="0"
                max="10"
                step="0.01"
            >

        </div>


        <div>

            <label>
                Nota 2
            </label>

            <input
                type="number"
                class="nota nota2"
                value="${nota2}"
                min="0"
                max="10"
                step="0.01"
            >

        </div>


        <div>

            <button
                type="button"
                class="btn btn-danger"
                onclick="this.parentElement.parentElement.remove(); calcularMedia()"
            >
                ×
            </button>

        </div>

    `;


    disciplinasDiv.appendChild(div);


    div.querySelectorAll("input")
        .forEach(input=>{

            input.addEventListener(
                "input",
                calcularMedia
            );

        });

    calcularMedia();

};


/* =========================
   MÉDIA
========================= */

function calcularMedia(){

    const linhas =
        document.querySelectorAll(
            ".disciplina-linha"
        );

    let soma=0;

    let quantidade=0;


    linhas.forEach(linha=>{

        const n1 =
            parseFloat(
                linha
                .querySelector(".nota1")
                .value
            );

        const n2 =
            parseFloat(
                linha
                .querySelector(".nota2")
                .value
            );


        let notas=[];


        if(!isNaN(n1))
            notas.push(n1);

        if(!isNaN(n2))
            notas.push(n2);


        if(notas.length){

            const media =
                notas.reduce(
                    (a,b)=>a+b,
                    0
                ) / notas.length;

            soma += media;

            quantidade++;

        }

    });


    const media =
        quantidade
        ? soma/quantidade
        : 0;


    document
        .getElementById("mediaGeral")
        .textContent =
        media.toFixed(2)
        .replace(".",",");

}


/* =========================
   SALVAR
========================= */

window.salvarHistorico =
async function(){

    if(!escolaId){

        mensagem(
            "Usuário sem escola vinculada.",
            "error"
        );

        return;

    }


    const alunoId =
        alunoSelect.value;


    if(!alunoId){

        mensagem(
            "Selecione o aluno.",
            "error"
        );

        return;

    }


    const aluno =
        alunos.find(
            a=>a.id===alunoId
        );


    const ano =
        Number(
            document
                .getElementById("ano")
                .value
        );


    const serie =
        document
            .getElementById("serie")
            .value;


    if(!ano || !serie){

        mensagem(
            "Informe o ano letivo e a série.",
            "error"
        );

        return;

    }


    const linhas =
        document.querySelectorAll(
            ".disciplina-linha"
        );


    const disciplinas=[];


    linhas.forEach(linha=>{

        const nome =
            linha
                .querySelector(".nome-disciplina")
                .value
                .trim();


        const nota1 =
            linha
                .querySelector(".nota1")
                .value;


        const nota2 =
            linha
                .querySelector(".nota2")
                .value;


        if(nome){

            disciplinas.push({

                nome,

                nota1:
                    nota1 === ""
                    ? null
                    : Number(nota1),

                nota2:
                    nota2 === ""
                    ? null
                    : Number(nota2)

            });

        }

    });


    const media =
        calcularMediaNumero();


    const dados={

        escolaId,

        alunoId,

        nomeAluno:
            aluno.nome || "",

        ano,

        serie,

        turno:
            document
                .getElementById("turno")
                .value,

        disciplinas,

        media,

        situacao:
            document
                .getElementById("situacao")
                .value,

        frequencia:
            document
                .getElementById("frequencia")
                .value === ""
                ? null
                : Number(
                    document
                        .getElementById("frequencia")
                        .value
                  ),

        observacoes:
            document
                .getElementById("observacoes")
                .value
                .trim(),

        atualizadoEm:
            serverTimestamp()

    };


    try{

        if(historicoEditando){

            await updateDoc(

                doc(
                    db,
                    "historicos",
                    historicoEditando
                ),

                dados

            );

            mensagem(
                "Histórico atualizado com sucesso."
            );

        }else{

            await addDoc(

                collection(
                    db,
                    "historicos"
                ),

                {

                    ...dados,

                    criadoEm:
                        serverTimestamp()

                }

            );

            mensagem(
                "Histórico salvo com sucesso."
            );

        }


        await carregarHistoricos();

        fecharEditor();

    }catch(error){

        console.error(error);

        mensagem(
            "Erro ao salvar: "+
            error.message,
            "error"
        );

    }

};


/* =========================
   CALCULAR MÉDIA NUMÉRICA
========================= */

function calcularMediaNumero(){

    const linhas =
        document.querySelectorAll(
            ".disciplina-linha"
        );

    let soma=0;

    let quantidade=0;


    linhas.forEach(linha=>{

        const n1 =
            parseFloat(
                linha
                .querySelector(".nota1")
                .value
            );

        const n2 =
            parseFloat(
                linha
                .querySelector(".nota2")
                .value
            );


        let notas=[];

        if(!isNaN(n1))
            notas.push(n1);

        if(!isNaN(n2))
            notas.push(n2);


        if(notas.length){

            soma +=
                notas.reduce(
                    (a,b)=>a+b,
                    0
                ) / notas.length;

            quantidade++;

        }

    });


    return quantidade
        ? Number(
            (soma/quantidade)
            .toFixed(2)
          )
        : 0;

}


/* =========================

async function editarHistorico(id){

    const h =
        historicos.find(
            item=>item.id===id
        );

    if(!h) return;


    historicoEditando=id;


    areaHistoricos.style.display =
        "none";

    areaEditor.style.display =
        "block";


    document
        .getElementById("tituloEditor")
        .textContent =
        "Editar Histórico";


    limparFormulario();


    alunoSelect.value =
        h.alunoId || "";


    alunoSelect.dispatchEvent(
        new Event("change")
    );


    document
        .getElementById("ano")
        .value =
        h.ano || "";


    document
        .getElementById("serie")
        .value =
        h.serie || "";


    document
        .getElementById("turno")
        .value =
        h.turno || "";


    document
        .getElementById("situacao")
        .value =
        h.situacao || "Aprovado";


    document
        .getElementById("frequencia")
        .value =
        h.frequencia ?? "";


    document
        .getElementById("observacoes")
        .value =
        h.observacoes || "";


    disciplinasDiv.innerHTML="";


    if(
        Array.isArray(
            h.disciplinas
        ) &&
        h.disciplinas.length
    ){

        h.disciplinas.forEach(d=>{

            adicionarDisciplina(

                d.nome || "",

                d.nota1 ?? "",

                d.nota2 ?? ""

            );

        });

    }else{

        adicionarDisciplina();

    }

}

    linhas.forEach(linha=>{

        resultado.push({

listaHistoricos.addEventListener(
    "click",
    async event=>{

        const botao =
            event.target.closest("button");

        if(!botao) return;


        const id =
            botao.dataset.id;

        const action =
            botao.dataset.action;


        if(action==="editar"){

            editarHistorico(id);

        }


        if(action==="visualizar"){

            const h =
                historicos.find(
                    x=>x.id===id
                );

            if(!h) return;


            const aluno =
                alunos.find(
                    a=>a.id===h.alunoId
                );


            if(!aluno) return;


            gerarDocumento({

                nomeAluno:
                    aluno.nome || h.nomeAluno,

                dataNascimento:
                    aluno.dataNascimento || "",

                cpf:
                    aluno.cpf || "",

                ano:
                    h.ano,

                serie:
                    h.serie,

                turno:
                    h.turno,

                disciplinas:
                    h.disciplinas || [],

                media:
                    h.media || 0,

                situacao:
                    h.situacao,

                frequencia:
                    h.frequencia,

                observacoes:
                    h.observacoes

            });

        }


        if(action==="excluir"){

            const confirmar =
                confirm(
                    "Deseja realmente excluir este histórico?"
                );

            if(!confirmar)
                return;


            try{

                await deleteDoc(

                    doc(
                        db,
                        "historicos",
                        id
                    )

                );


                mensagem(
                    "Histórico excluído."
                );


                await carregarHistoricos();

            }catch(error){

                console.error(error);

                mensagem(
                    "Erro ao excluir: "+
                    error.message,
                    "error"
                );

            }

        }

    }
);

/* =========================
   ESCAPAR
========================= */

function escapar(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function formatarNota(valor){

    if(
        valor === "" ||
        valor === null ||
        valor === undefined
    )
        return "-";

    return Number(valor)
        .toFixed(2)
        .replace(".",",");

}
